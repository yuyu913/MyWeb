const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mapUrl(name){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' 台中')}
function districtOf(name){if(mapData[name]?.district)return mapData[name].district;for(const [key,val] of districtRules)if(name.includes(key))return val;return '—'}
function mapSummary(name){const d=mapData[name];if(!d)return '<span class="map-rating"><i class="bi bi-geo-alt-fill"></i> Google Maps</span><span class="map-detail"> · 查看最新資訊</span>';const detail=[d.price,d.category].filter(Boolean).join(' · ');return '<span class="map-rating">★ '+esc(d.rating)+' ('+esc(d.reviews)+')</span>'+(detail?'<span class="map-detail"> · '+esc(detail)+'</span>':'')}
function sortByDistrict(items){return [...items].sort((a,b)=>{const da=districtOf(a),db=districtOf(b),ia=districtOrder.indexOf(da),ib=districtOrder.indexOf(db);if(ia!==ib)return ia-ib;return a.localeCompare(b,'zh-Hant')})}
function render(){
const keyword=$('searchInput').value.trim().toLowerCase();let html='';
for(const group of foodGroups){
let items=group.items.filter(name=>!keyword||name.toLowerCase().includes(keyword));if(!items.length)continue;items=sortByDistrict(items);
html+='<section class="group"><header class="group-head"><div class="group-meta"><i class="bi '+group.icon+' group-icon"></i><h2 class="group-title">'+esc(group.name)+'</h2></div><span class="group-count">'+items.length+' 家</span></header>';
html+=items.map(name=>'<div class="food-row"><div class="food-name" title="'+esc(name)+'">'+esc(name)+'</div><div class="food-district">'+esc(districtOf(name))+'</div><a class="map-info" href="'+mapUrl(name)+'" target="_blank" rel="noopener" title="在 Google 地圖搜尋 '+esc(name)+'">'+mapSummary(name)+'</a></div>').join('');
html+='</section>';
}
$('groupsWrap').innerHTML=html||'<section class="group"><div class="empty">找不到符合的店家</div></section>';
}
