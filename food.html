const onlineNames=new Set(['Perlette 精品服飾＆海老闆嚴選美衣好物','Keya Jam 柯亞果醬','PEKOE 食品雜貨鋪','台灣原味','食誠良品','manis manis 甜・覓室','el postre 帛絲翠','Find Joy in Each Day 肥德蓮專門店','HUNG patisserie 虹甜點工作室','Argyi 掬菓','CAN by VON','法務部矯正署臺中女子監獄','法務部矯正署桃園女子監獄']);
const districtRules=[['沙鹿','沙鹿區'],['大雅','大雅區'],['豐原','豐原區'],['烏日','烏日區'],['清水','清水區'],['新社','新社區'],['北屯','北屯區'],['南屯','南屯區'],['東勢','東勢區'],['逢甲','西屯區'],['水湳','北屯區'],['旱溪','東區'],['大智路','東區'],['中華','中區']];
const districtOrder=['中區','東區','西區','南區','北區','西屯區','南屯區','北屯區','豐原區','東勢區','大甲區','清水區','沙鹿區','梧棲區','后里區','神岡區','潭子區','大雅區','新社區','石岡區','外埔區','大安區','烏日區','大肚區','龍井區','霧峰區','太平區','大里區','和平區','線上','—'];

const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mapUrl(name){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' 台中')}
function districtOf(name){if(onlineNames.has(name))return '線上';if(mapData[name]?.district)return mapData[name].district;for(const [key,val] of districtRules)if(name.includes(key))return val;return '—'}
function mapSummary(name){const d=mapData[name];if(!d)return '<span class="map-rating">Google Maps 資料未公開</span>';const reviewText=d.reviews&&d.reviews!=='—'?' ('+esc(d.reviews)+')':'';const detail=[d.price,d.category].filter(Boolean).join(' · ');return '<span class="map-rating">★ '+esc(d.rating)+reviewText+'</span>'+(detail?'<span class="map-detail"> · '+esc(detail)+'</span>':'')}
function sortByDistrict(items){return [...items].sort((a,b)=>{const da=districtOf(a),db=districtOf(b),ia=districtOrder.indexOf(da),ib=districtOrder.indexOf(db);if(ia!==ib)return ia-ib;return a.localeCompare(b,'zh-Hant')})}
function render(){
const keyword=$('searchInput').value.trim().toLowerCase();let html='';
for(const group of foodGroups){
let items=group.items.filter(name=>!keyword||name.toLowerCase().includes(keyword));if(!items.length)continue;items=sortByDistrict(items);
html+='<section class="group"><header class="group-head"><div class="group-meta"><i class="bi '+group.icon+' group-icon"></i><h2 class="group-title">'+esc(group.name)+'</h2></div><span class="group-count">'+items.length+' 家</span></header>';
html+=items.map(name=>'<div class="food-row"><div class="food-name" title="'+esc(name)+'">'+esc(name)+'</div><div class="food-district">'+esc(districtOf(name))+'</div><a class="map-info" href="'+mapUrl(name)+'" target="_blank" rel="noopener" title="在 Google 地圖搜尋 '+esc(name)+'">'+mapSummary(name)+'</a></div>').join('');
html+='</section>';
}
$('groupsWrap').innerHTML=html||'<section class="group"><div class="empty">找不到符合的店家</div></section>';
}
$('searchInput').addEventListener('input',render);render();
