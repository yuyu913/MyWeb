<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魚魚の台中美食清單 🍴</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍴</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#fff8fb;--white:rgba(255,255,255,.96);--line:#eee8ef;--line2:#e3dce6;--text:#2f3040;--muted:#8f8b99;--pink:#fff0f6;--pink-bd:#f6d8e5;--blue:#f1f8fd;--blue-bd:#d8e9f4;--lav:#faf7fc;--lav-bd:#e8dff0;--shadow:0 7px 22px rgba(49,39,55,.055)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;background:radial-gradient(900px 450px at 8% 0%,rgba(255,181,210,.20),transparent 55%),radial-gradient(850px 420px at 92% 8%,rgba(173,220,250,.22),transparent 55%),radial-gradient(900px 500px at 50% 100%,rgba(255,225,133,.14),transparent 55%),var(--bg)}
.app{max-width:1160px;margin:18px auto 50px;padding:0 14px}
.hero,.panel,.group{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero{border-radius:16px;padding:14px 17px;background:linear-gradient(100deg,rgba(255,240,246,.82),rgba(241,248,253,.82),rgba(255,249,232,.58)),var(--white)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.brand-icon{width:39px;height:39px;border-radius:11px;display:grid;place-items:center;font-size:20px;border:1px solid var(--pink-bd);background:linear-gradient(135deg,var(--pink),var(--blue))}
.hero h1{font-size:1.38rem;font-weight:850;margin:0}
.hero-sub{margin:5px 0 0;color:var(--muted);font-size:.78rem}
.soft-btn{border:1px solid var(--line2);background:#fff;color:#5f5d69;border-radius:9px;padding:6px 9px;font-size:.8rem;display:inline-flex;gap:5px;align-items:center;line-height:1.2}
.soft-btn:hover{background:#fffafd}
.panel{border-radius:14px;padding:10px 12px;margin-top:11px;background:rgba(255,255,255,.92)}
.search{position:relative}.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#aaa3af;font-size:.84rem}
.form-control{border-color:var(--line2);border-radius:8px;font-size:.8rem;padding:7px 8px}.search .form-control{padding-left:32px}
.form-control:focus{border-color:#d7bfd0;box-shadow:0 0 0 .15rem rgba(230,170,200,.10)}
.groups{display:grid;gap:10px;margin-top:11px}
.group{border-radius:14px;overflow:hidden}
.group-head{min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 11px;background:linear-gradient(90deg,#fcf8fd,#f8fbfe);border-bottom:1px solid var(--lav-bd)}
.group-meta{display:flex;align-items:center;gap:8px;min-width:0}
.group-icon{color:#9a88aa;font-size:.92rem}
.group-title{margin:0;font-size:.94rem;font-weight:800;color:#665d70}
.group-count{color:#a29aa8;font-size:.7rem;white-space:nowrap}
.food-row{display:grid;grid-template-columns:34px minmax(0,1fr) 105px;gap:10px;align-items:center;min-height:42px;padding:5px 11px;border-bottom:1px solid #f3eef3}
.food-row:last-child{border-bottom:0}.food-row:hover{background:#fffcfe}
.food-index{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:var(--lav);border:1px solid var(--lav-bd);font-size:.69rem;color:#94899b;font-variant-numeric:tabular-nums}
.food-name{font-size:.8rem;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-btn{text-decoration:none;justify-self:end;border:1px solid var(--blue-bd);background:var(--blue);color:#55758b;border-radius:9px;padding:5px 8px;font-size:.74rem;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.map-btn:hover{background:#eaf5fc;color:#416579}
.empty{padding:18px;text-align:center;color:#9e97a4;font-size:.8rem}
.hidden{display:none!important}
@media(max-width:620px){.app{margin-top:10px}.hero{padding:12px}.food-row{grid-template-columns:30px minmax(0,1fr) 38px;padding:5px 8px;gap:7px}.map-btn span{display:none}.map-btn{width:32px;height:30px;padding:0;justify-content:center}.group-count{display:none}.food-name{font-size:.76rem}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<div class="hero-top">
<div class="brand"><div class="brand-icon">🍴</div><div><h1>魚魚の台中美食清單</h1><p class="hero-sub">500盤・必比登・500碗・500甜</p></div></div>
<a class="soft-btn text-decoration-none" href="./index.html"><i class="bi bi-house"></i> 回首頁</a>
</div>
</section>

<section class="panel">
<div class="search"><i class="bi bi-search"></i><input id="searchInput" class="form-control" placeholder="搜尋餐廳或店家名稱..."></div>
</section>

<main id="groupsWrap" class="groups"></main>
</div>

<script>
// 純靜態清單，不使用資料庫。
const foodGroups=[
{
name:'500盤',icon:'bi-award',
items:[
'飛花落院','頂粵吉品','湖南味','与玥樓','小樂沐',
'Mariposa Bistro 蝴蝶餐廳','滿堂','元 YUAN','金悅軒','醉鴛鴦啤酒廣場',
'DNA 西班牙餐廳','Enrich restaurant & café','Vima House 維摩舍','小夏天 petit été','虹夕諾雅谷關','魚麗共同廚房',
'enPure 瀞','TROIS 三一','春日宴','燒肉本氣','阿助鵝肉攤',
'Brass Hana 銅錵日式涮涮鍋','Glou Suru','水赤床','明娟樓','香・寓','梅子活海鮮餐廳','龍富 天婦羅',
'Petit Petit','Zài cuisine','布洛思廚','全鴨坊市政總店','自在天昆布水つけ麵','弄堂－江浙一味','東引釣客野生海產店','真好記海鮮料理','惠中蔬食滴水坊','菩薩寺維摩舍','萬月樓','鮨承'
]},
{
name:'必比登',icon:'bi-stars',
items:[
'新月梧桐','阿坤麵','竹之鄉','陳明統爌肉飯','鳳記鵝肉老店','鮮魚鱻','富鼎旺','富狀元豬腳','富貴亭','咕嚕咕嚕原住民音樂餐廳','越南你好','曙光居','陸園','羅家古早味','菇神（新社）','京華煙雲','醉月樓','好先生','木公麥面','牛稼莊','上海未名麵點','東方龍','三喜食堂','饕之鄉','溫叨','沙卡','繡球','彭城堂'
]},
{
name:'500碗',icon:'bi-cup-hot',
items:[
'三時茶房','鹿行艸地','五市肉包','松葉壽司','大智路蕭爌肉飯','旱溪觀光夜市酥皮春捲','珍品小吃','嵐肉燥專賣店','翁記泡沫廣場','城市奶冰樂台中中華店',
'丁記炸粿','三回','上海灘租界地','大雅無名麵攤臭豆腐','大雅萬丹紅豆餅豐仁冰','天津苟不理湯包','台南蘇無刺虱目魚','四季春甜食店','旬魚','東佳牛肉麵館','阿川鵝肉','品味香麵攤','乾麵酸菜湯老店','現採炭烤玉米','蚵仔粥','陳記蚵仔麵線','頂好炸雞','鵝城','麵哥麵嫂','饕食館',
'「傳」台中正老牌香菇肉羹（綠川店）','大慈天然素食','子梧桐 日本傳統手工烏龍麵','小山西館','小林雞肉飯','六豊','水湳台中肉圓','弘水煎包','民生嘉義米糕','你最蒸粿','吳記脆皮肉圓','沙鹿肉圓福（沙田店）','阿棋三代福州意麵老店','南陽路炒麵豬血湯','柳川大麵焿水晶餃','美蓁小吃店','風鼓崎豬血湯老店','烏日水煎包','租界','清水燒炸粿','許愿 飲食空間','無招牌自治街乾麵','鈞苰牛肉麵','新豐源排骨麵店','董媽涼麵','聚眾緣麵館','聞湘小館','寬華薑母鴨','鄭記上海蟹殼黃碳烤小酥餅','顏正原燒烤／串燒（北平店）',
'日棧飯糰','合作街大麵羹',
'TAKU 牛丼專賣','三鮮湯包','大雅牛肉麵','大雅炸雞','水湳臭豆腐','旱溪肉圓','北屯佳賓黑白切','台南本產阿文溫體牛肉湯','阿彰飯担','阿靜の潤餅－向上店','南屯豬腳麵線','炸粿生三代老店','紅樹腳香菇肉羹','風飛沙小吃店','鹿港扁食','新社老街豆腐宗','萬順羹麵創始店','曉明湯包','翰德正老牌蚵仔粥','藍山牛肉麵','正老牌豐原肉丸'
]},
{
name:'500甜',icon:'bi-cake2',
items:[
'坂神本舖長崎蛋糕',
'National Park bakery 國家公園餅店','戰豆冰','陳記涼茶本舖','美村點頭冰','奉咖啡','不二糕餅','硬翰拔絲米血',
'純植烘焙所','APRIL 植物系甜點','甜寓17烘焙所','28 Bake House','烏婆傳統甜品店','沙鹿豆花','樹下阿婆粉圓','喜豐香餅舖','日錦製造所','順口味豆花','七賢紅麴米糕','阿銘伯花生捲冰淇淋','Huii 達克瓦茲專賣店','咖啡葉','IBS 菩薩寺','豐原義華鹹蛋糕','羅拉典藏蛋糕','愛莉兒手作烘焙坊','Domochew Lab 多麼秋生活食驗室',"LULU's Choice",'Miss B Drink & Food','AGIO Chocolates 愛其歐巧克力'
]}
];

const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mapUrl(name){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' 台中')}
function render(){
const keyword=$('searchInput').value.trim().toLowerCase();
let html='';
for(const group of foodGroups){
const items=group.items.filter(name=>!keyword||name.toLowerCase().includes(keyword));
if(!items.length)continue;
html+=`<section class="group">
<header class="group-head">
<div class="group-meta"><i class="bi ${group.icon} group-icon"></i><h2 class="group-title">${esc(group.name)}</h2></div>
<span class="group-count">${items.length} 家</span>
</header>
${items.map((name,i)=>`<div class="food-row">
<div class="food-index">${String(i+1).padStart(2,'0')}</div>
<div class="food-name" title="${esc(name)}">${esc(name)}</div>
<a class="map-btn" href="${mapUrl(name)}" target="_blank" rel="noopener" title="在 Google 地圖搜尋 ${esc(name)}"><i class="bi bi-geo-alt-fill"></i><span>Google Map</span></a>
</div>`).join('')}
</section>`;
}
$('groupsWrap').innerHTML=html||'<section class="group"><div class="empty">找不到符合的店家</div></section>';
}
$('searchInput').addEventListener('input',render);
render();
</script>
</body>
</html>
