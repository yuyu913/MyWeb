<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魚魚の收藏夾 🔖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--card:rgba(255,255,255,.92);--stroke:rgba(16,24,40,.08);--text:#1f2937;--muted:#7b8492;--pink-bg:rgba(255,111,177,.12);--pink-bd:rgba(255,111,177,.28);--blue-bg:rgba(107,199,255,.14);--blue-bd:rgba(107,199,255,.32);--blue-tx:#0f3a56;--yellow-bg:rgba(255,211,77,.20);--yellow-bd:rgba(255,211,77,.45);--shadow:0 10px 30px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;background:radial-gradient(1200px 600px at 10% 0%,rgba(255,111,177,.14),transparent 50%),radial-gradient(900px 500px at 90% 10%,rgba(107,199,255,.16),transparent 50%),radial-gradient(1000px 600px at 50% 100%,rgba(255,211,77,.14),transparent 50%),var(--bg)}
.app{max-width:1180px;margin:24px auto 60px;padding:0 14px}.hero,.panel,.group{border:1px solid var(--stroke);background:var(--card);backdrop-filter:blur(10px);box-shadow:var(--shadow)}.hero{border-radius:22px;padding:20px;background:linear-gradient(90deg,rgba(255,111,177,.09),rgba(107,199,255,.09),rgba(255,211,77,.09)),rgba(255,255,255,.82)}.hero-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;border:1px solid var(--stroke);background:linear-gradient(135deg,var(--pink-bg),var(--blue-bg))}.hero h1{font-size:1.8rem;font-weight:900;margin:0}.hero p{margin:4px 0 0;color:var(--muted)}
.actions,.stats,.filters,.group-actions{display:flex;gap:8px;flex-wrap:wrap}.actions,.stats{margin-top:14px}.soft-btn,.filter-btn,.add-page{border-radius:999px;border:1px solid var(--stroke);background:rgba(255,255,255,.8);padding:8px 12px;font-size:.88rem;color:var(--text);display:inline-flex;gap:7px;align-items:center}.soft-btn:hover,.filter-btn:hover,.add-page:hover{background:#fff}.soft-btn.pink{background:var(--pink-bg);border-color:var(--pink-bd);color:#7a284f}.soft-btn.yellow{background:var(--yellow-bg);border-color:var(--yellow-bd);color:#6b4b00}.soft-btn.gray{background:rgba(16,24,40,.04)}.soft-btn:disabled{opacity:.55}.stat{border-radius:999px;padding:6px 10px;font-size:.82rem;border:1px dashed var(--stroke);background:rgba(255,255,255,.66)}
.panel{border-radius:18px;padding:14px;margin-top:14px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px}.search{position:relative}.search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{padding-left:38px}.form-control{border-radius:13px;border-color:rgba(16,24,40,.12)}.form-control:focus{border-color:rgba(255,111,177,.38);box-shadow:0 0 0 .2rem rgba(255,111,177,.10)}.filters{margin-top:12px}.filter-btn{padding:7px 11px;color:var(--muted)}.filter-btn.active{background:linear-gradient(135deg,var(--pink-bg),var(--blue-bg));border-color:var(--pink-bd);color:var(--text)}
.groups{display:grid;gap:14px;margin-top:14px}.group{border-radius:18px;overflow:hidden}.group-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--stroke);background:linear-gradient(90deg,rgba(255,111,177,.09),rgba(107,199,255,.09),rgba(255,211,77,.09))}.group-title{margin:0;font-size:1.05rem;font-weight:900}.group-count{font-size:.8rem;color:var(--muted);margin-top:2px}.add-page{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-tx);font-weight:700;padding:7px 10px}.icon-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--stroke);background:rgba(255,255,255,.8);display:grid;place-items:center;color:#4b5563}.icon-btn:hover{background:#fff}
.page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}.page-card{position:relative;border:1px solid var(--stroke);border-radius:15px;background:#fff;padding:12px 42px 12px 12px;min-width:0;transition:.18s}.page-card:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(16,24,40,.08)}.page-link{text-decoration:none;color:inherit;display:flex;gap:10px;align-items:center}.favicon{width:40px;height:40px;flex:0 0 40px;border-radius:11px;border:1px solid var(--stroke);display:grid;place-items:center;overflow:hidden;background:#fff;font-weight:800}.favicon img{width:23px;height:23px;object-fit:contain}.page-info{min-width:0}.page-name{font-weight:850;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.page-title{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;line-height:1.25}.page-edit{position:absolute;right:8px;top:8px}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.hidden{display:none!important}.import-state{font-size:.82rem;color:var(--muted);align-self:center}.status-title{font-weight:850;margin:0 0 6px}.status-text{color:var(--muted);margin:0}.modal-content{border-radius:20px;border:1px solid var(--stroke);box-shadow:var(--shadow)}.modal-header{background:linear-gradient(90deg,var(--pink-bg),var(--blue-bg),var(--yellow-bg))}.chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 9px;background:var(--blue-bg);border:1px solid var(--blue-bd);font-size:.82rem;color:var(--blue-tx)}.field-help{font-size:.78rem;color:var(--muted);margin-top:5px}
@media(max-width:900px){.page-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.app{margin-top:12px}.toolbar{grid-template-columns:1fr}.page-grid{grid-template-columns:1fr}.group-head{align-items:flex-start}.group-actions{justify-content:flex-end}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<div class="hero-top">
<div class="brand"><div class="brand-icon">🐟</div><div><h1>魚魚の收藏夾 🔖</h1><p>群組裡放分頁｜Toby 資料直接搬過來</p></div></div>
<div><a class="soft-btn gray text-decoration-none" href="./index.html"><i class="bi bi-house"></i> 回首頁</a> <button id="logoutBtn" class="soft-btn gray hidden"><i class="bi bi-box-arrow-right"></i> 登出</button></div>
</div>
<div id="mainActions" class="actions hidden"><button class="soft-btn pink" onclick="openGroupModal()"><i class="bi bi-folder-plus"></i> 新增群組</button><button id="importBtn" class="soft-btn yellow" onclick="document.getElementById('tobyFiles').click()"><i class="bi bi-box-arrow-in-down"></i> 匯入 Toby JSON</button><input id="tobyFiles" class="hidden" type="file" accept=".json,application/json" multiple><span id="importState" class="import-state"></span></div>
<div id="stats" class="stats hidden"><span class="stat" id="groupStat">0 個群組</span><span class="stat" id="pageStat">0 個分頁</span></div>
</section>

<section id="loginPanel" class="panel hidden"><h2 class="status-title">🔐 私人收藏</h2><p class="status-text">只有你的 Google 帳號能使用。</p><button id="googleLoginBtn" class="soft-btn pink mt-3"><i class="bi bi-google"></i> 使用 Google 登入</button></section>
<section id="deniedPanel" class="panel hidden"><h2 class="status-title">⛔ 無法使用</h2><p class="status-text">這個帳號沒有使用權限。</p></section>
<section id="toolbar" class="panel hidden"><div class="toolbar"><div class="search"><i class="bi bi-search"></i><input id="searchInput" class="form-control" placeholder="搜尋名稱或網站標題..."></div><button id="refreshBtn" class="soft-btn gray"><i class="bi bi-arrow-clockwise"></i> 重新整理</button></div><div id="groupFilters" class="filters"></div></section>
<main id="groupsWrap" class="groups"></main>
</div>

<div class="modal fade" id="groupModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 id="groupModalTitle" class="modal-title fw-bold">新增群組</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="groupId" type="hidden"><label class="form-label fw-bold">群組名稱</label><input id="groupName" class="form-control" placeholder="例如：CSS、工作、旅遊"></div><div class="modal-footer justify-content-between"><button id="deleteGroupBtn" class="btn btn-outline-danger hidden">刪除群組</button><div><button class="btn btn-light" data-bs-dismiss="modal">取消</button> <button id="saveGroupBtn" class="btn btn-dark">儲存</button></div></div></div></div></div>

<div class="modal fade" id="pageModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 id="pageModalTitle" class="modal-title fw-bold">新增分頁</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="pageId" type="hidden"><input id="pageGroupId" type="hidden"><div id="pageGroupName" class="chip mb-3"></div>
<div class="mb-3"><label class="form-label fw-bold">網址</label><input id="pageUrl" class="form-control" type="url" placeholder="https://..."></div>
<div class="mb-3"><label class="form-label fw-bold">網站標題</label><input id="pageTitle" class="form-control" placeholder="網站原本的標題"><div class="field-help">Toby 匯入時會自動帶入原始標題。</div></div>
<div><label class="form-label fw-bold">名稱</label><input id="pageName" class="form-control" placeholder="可留空，會沿用網站標題"><div class="field-help">這是你自己取的名稱；不填就顯示網站標題。</div></div>
</div><div class="modal-footer justify-content-between"><button id="deletePageBtn" class="btn btn-outline-danger hidden">刪除分頁</button><div><button class="btn btn-light" data-bs-dismiss="modal">取消</button> <button id="savePageBtn" class="btn btn-dark">儲存</button></div></div></div></div></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="d-flex"><div id="toastText" class="toast-body">完成</div><button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDD6qyMvRJI714bMq54jQjUeaU25BjU5B0",authDomain:"eateatfish-d8207.firebaseapp.com",projectId:"eateatfish-d8207",storageBucket:"eateatfish-d8207.firebasestorage.app",messagingSenderId:"497313231668",appId:"1:497313231668:web:e4340b9ac59e2abf0c2b61",measurementId:"G-WRBLFF04SF"};
const ALLOWED_UID='zK8b0EzOBzbioXBqbgnRaF5uJJ22';
let auth,db,user=null,groups=[],pages=[],activeGroup='all',keyword='';
const $=id=>document.getElementById(id);
const groupModal=new bootstrap.Modal($('groupModal'));
const pageModal=new bootstrap.Modal($('pageModal'));
const toast=new bootstrap.Toast($('appToast'),{delay:3500});

function visible(id,on){$(id).classList.toggle('hidden',!on)}
function msg(text){$('toastText').textContent=text;toast.show()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function normUrl(v=''){let s=String(v).trim();if(!s)return'';return /^https?:\/\//i.test(s)?s:'https://'+s}
function favicon(url){try{return new URL(url).origin+'/favicon.ico'}catch{return''}}
function groupsRef(){return db.collection('users').doc(user.uid).collection('groups')}
function pagesRef(){return db.collection('users').doc(user.uid).collection('bookmarks')}
function displayName(page){return String(page.name||'').trim()||String(page.title||'').trim()||'未命名'}

function init(){
    firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
    auth.onAuthStateChanged(async u=>{
        user=u;
        if(u&&u.uid!==ALLOWED_UID){visible('loginPanel',false);visible('deniedPanel',true);visible('logoutBtn',true);visible('mainActions',false);visible('stats',false);visible('toolbar',false);$('groupsWrap').innerHTML='';return}
        visible('deniedPanel',false);const ok=!!u;visible('loginPanel',!ok);visible('logoutBtn',ok);visible('mainActions',ok);visible('stats',ok);visible('toolbar',ok);if(ok)await loadData();else $('groupsWrap').innerHTML='';
    });
}
$('googleLoginBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){console.error(e);msg('登入失敗：'+e.message)}};
$('logoutBtn').onclick=()=>auth.signOut();

async function loadData(){
    try{
        const[g,p]=await Promise.all([groupsRef().orderBy('sortOrder').get(),pagesRef().orderBy('sortOrder').get()]);
        groups=g.docs.map(d=>({id:d.id,...d.data()}));
        pages=p.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.groupId);
        render();
    }catch(e){console.error(e);msg('讀取失敗：'+e.message)}
}

function render(){
    $('groupStat').textContent=`${groups.length} 個群組`;
    $('pageStat').textContent=`${pages.length} 個分頁`;
    renderFilters();renderGroups();
}
function renderFilters(){
    let h=`<button class="filter-btn ${activeGroup==='all'?'active':''}" data-id="all">全部</button>`;
    for(const g of groups)h+=`<button class="filter-btn ${activeGroup===g.id?'active':''}" data-id="${g.id}">${esc(g.name)}</button>`;
    $('groupFilters').innerHTML=h;
    $('groupFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeGroup=b.dataset.id;renderFilters();renderGroups()});
}
function hit(page){
    if(!keyword)return true;
    const name=displayName(page).toLowerCase();
    const title=String(page.title||'').toLowerCase();
    return name.includes(keyword)||title.includes(keyword);
}
function renderGroups(){
    if(!groups.length){$('groupsWrap').innerHTML='<section class="group"><div class="empty">📁 還沒有群組<br>新增群組或匯入 Toby JSON</div></section>';return}
    let h='';
    for(const g of groups.filter(x=>activeGroup==='all'||activeGroup===x.id)){
        const items=pages.filter(p=>p.groupId===g.id&&hit(p));
        if(keyword&&!items.length)continue;
        h+=`<section class="group"><header class="group-head"><div><h2 class="group-title">📁 ${esc(g.name)}</h2><div class="group-count">${items.length} 個分頁</div></div><div class="group-actions"><button class="add-page" onclick="openPage('', '${g.id}')"><i class="bi bi-plus-lg"></i> 加分頁</button><button class="icon-btn" title="編輯群組" onclick="openGroup('${g.id}')"><i class="bi bi-pencil"></i></button></div></header>${items.length?`<div class="page-grid">${items.map(pageCard).join('')}</div>`:`<div class="empty">這個群組還沒有分頁<br><button class="add-page mt-2" onclick="openPage('', '${g.id}')">＋ 加第一個分頁</button></div>`}</section>`;
    }
    $('groupsWrap').innerHTML=h||'<section class="group"><div class="empty">🔎 找不到符合的分頁</div></section>';
}
function pageCard(page){
    const name=displayName(page),title=String(page.title||'').trim()||name,f=favicon(page.url);
    return `<article class="page-card"><a class="page-link" href="${esc(page.url)}" target="_blank" rel="noopener"><div class="favicon">${f?`<img src="${esc(f)}" alt="" onerror="this.style.display='none';this.parentNode.textContent='${esc(name.charAt(0)||'?')}'">`:esc(name.charAt(0)||'?')}</div><div class="page-info"><div class="page-name" title="${esc(name)}">${esc(name)}</div><div class="page-title" title="${esc(title)}">${esc(title)}</div></div></a><button class="icon-btn page-edit" title="編輯分頁" onclick="event.preventDefault();event.stopPropagation();openPage('${page.id}')"><i class="bi bi-three-dots"></i></button></article>`;
}
$('searchInput').oninput=e=>{keyword=e.target.value.trim().toLowerCase();renderGroups()};
$('refreshBtn').onclick=loadData;

function openGroup(id=''){
    const g=groups.find(x=>x.id===id);$('groupId').value=g?.id||'';$('groupName').value=g?.name||'';$('groupModalTitle').textContent=g?'編輯群組':'新增群組';visible('deleteGroupBtn',!!g);groupModal.show();
}
window.openGroup=openGroup;window.openGroupModal=openGroup;
$('saveGroupBtn').onclick=async()=>{
    const id=$('groupId').value,name=$('groupName').value.trim();if(!name)return msg('請輸入群組名稱');
    try{id?await groupsRef().doc(id).update({name}):await groupsRef().add({name,sortOrder:groups.length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});groupModal.hide();await loadData()}catch(e){msg('儲存失敗：'+e.message)}
};
$('deleteGroupBtn').onclick=async()=>{
    const id=$('groupId').value,g=groups.find(x=>x.id===id);if(!g||!confirm(`刪除「${g.name}」和裡面的所有分頁？`))return;
    try{const related=pages.filter(p=>p.groupId===id);for(let i=0;i<related.length;i+=400){const b=db.batch();related.slice(i,i+400).forEach(p=>b.delete(pagesRef().doc(p.id)));await b.commit()}await groupsRef().doc(id).delete();groupModal.hide();activeGroup='all';await loadData()}catch(e){msg('刪除失敗：'+e.message)}
};

function openPage(id='',groupId=''){
    const p=pages.find(x=>x.id===id),gid=p?.groupId||groupId,g=groups.find(x=>x.id===gid);if(!g)return msg('找不到群組');
    $('pageId').value=p?.id||'';$('pageGroupId').value=gid;$('pageGroupName').innerHTML=`<i class="bi bi-folder2"></i> ${esc(g.name)}`;$('pageUrl').value=p?.url||'';$('pageTitle').value=p?.title||'';$('pageName').value=p?.name||'';$('pageModalTitle').textContent=p?'編輯分頁':'新增分頁';visible('deletePageBtn',!!p);pageModal.show();
}
window.openPage=openPage;
$('savePageBtn').onclick=async()=>{
    const id=$('pageId').value,groupId=$('pageGroupId').value,url=normUrl($('pageUrl').value),title=$('pageTitle').value.trim(),name=$('pageName').value.trim();
    if(!url)return msg('請輸入網址');if(!title)return msg('請輸入網站標題');
    const data={groupId,url,title,name};
    try{id?await pagesRef().doc(id).update(data):await pagesRef().add({...data,sortOrder:pages.filter(x=>x.groupId===groupId).length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});pageModal.hide();await loadData()}catch(e){msg('儲存失敗：'+e.message)}
};
$('deletePageBtn').onclick=async()=>{
    const id=$('pageId').value;if(!id||!confirm('刪除這個分頁？'))return;
    try{await pagesRef().doc(id).delete();pageModal.hide();await loadData()}catch(e){msg('刪除失敗：'+e.message)}
};

// Toby：每個 JSON 檔代表一個群組；title 是網站原始標題，customTitle 是自訂名稱。
$('tobyFiles').addEventListener('change',async e=>{
    const files=[...(e.target.files||[])];e.target.value='';if(!files.length)return;
    $('importBtn').disabled=true;let newGroups=0,newPages=0,skipped=0,failed=[];
    for(let i=0;i<files.length;i++){
        const file=files[i];$('importState').textContent=`匯入中 ${i+1}/${files.length}：${file.name}`;
        try{
            const data=JSON.parse(await file.text());
            if(!data||!Array.isArray(data.lists)||!data.lists.length||!Array.isArray(data.lists[0]?.cards)){skipped++;continue}
            const list=data.lists[0];
            const groupName=String(list.title||file.name.replace(/\.json$/i,'')).trim();
            let group=groups.find(g=>g.name.trim().toLowerCase()===groupName.toLowerCase());
            if(!group){const ref=await groupsRef().add({name:groupName,sortOrder:groups.length+newGroups,createdAt:firebase.firestore.FieldValue.serverTimestamp()});group={id:ref.id,name:groupName};groups.push(group);newGroups++}
            const existing=new Set(pages.filter(p=>p.groupId===group.id).map(p=>p.url));
            const rows=[];
            for(const card of list.cards){
                const url=normUrl(card?.url);if(!url||existing.has(url))continue;
                const title=String(card?.title||'').trim()||url;
                const name=String(card?.customTitle||'').trim();
                rows.push({groupId:group.id,url,title,name,sortOrder:pages.filter(p=>p.groupId===group.id).length+rows.length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});existing.add(url);
            }
            for(let n=0;n<rows.length;n+=400){const batch=db.batch();rows.slice(n,n+400).forEach(row=>batch.set(pagesRef().doc(),row));await batch.commit()}
            newPages+=rows.length;
        }catch(err){console.error('[Toby Import]',file.name,err);failed.push(file.name)}
    }
    await loadData();$('importBtn').disabled=false;
    let text=`完成：${newGroups} 個新群組、${newPages} 個分頁`;
    if(skipped)text+=`，略過 ${skipped} 個非 Toby JSON`;
    if(failed.length)text+=`，${failed.length} 個檔案失敗`;
    $('importState').textContent=text;msg(text);
});

init();
</script>
</body>
</html>
