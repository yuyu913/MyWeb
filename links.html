<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魚魚の收藏夾 🔖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#fff8fb;--white:rgba(255,255,255,.96);--line:#eee8ef;--line2:#e3dce6;--text:#2f3040;--muted:#8f8b99;--pink:#fff0f6;--pink-bd:#f6d8e5;--blue:#f1f8fd;--blue-bd:#d8e9f4;--yellow:#fff9e8;--yellow-bd:#f2e4b8;--lav:#f7f3fb;--lav-bd:#e8dff0;--danger:#b85f6b;--shadow:0 7px 22px rgba(49,39,55,.055)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;background:radial-gradient(900px 450px at 8% 0%,rgba(255,181,210,.20),transparent 55%),radial-gradient(850px 420px at 92% 8%,rgba(173,220,250,.22),transparent 55%),radial-gradient(900px 500px at 50% 100%,rgba(255,225,133,.14),transparent 55%),var(--bg)}
.app{max-width:1280px;margin:18px auto 50px;padding:0 14px}.hero,.panel,.group{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:16px;padding:15px 17px;background:linear-gradient(100deg,rgba(255,240,246,.78),rgba(241,248,253,.78),rgba(255,249,232,.55)),var(--white)}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.brand-icon{width:39px;height:39px;border-radius:11px;display:grid;place-items:center;font-size:20px;border:1px solid var(--pink-bd);background:linear-gradient(135deg,var(--pink),var(--blue))}.hero h1{font-size:1.38rem;font-weight:850;margin:0}.hero p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.actions,.stats,.filters,.group-actions,.row-actions{display:flex;gap:7px;flex-wrap:wrap}.actions{margin-top:12px}.stats{margin-top:10px}.soft-btn,.filter-btn,.mini-btn{border:1px solid var(--line2);background:#fff;color:#5f5d69;border-radius:9px;padding:6px 9px;font-size:.8rem;display:inline-flex;gap:5px;align-items:center;line-height:1.2}.soft-btn:hover,.filter-btn:hover,.mini-btn:hover{background:#fffafd}.soft-btn.primary,.mini-btn.primary{background:var(--pink);border-color:var(--pink-bd);color:#86546a}.soft-btn.import{background:var(--yellow);border-color:var(--yellow-bd);color:#79672f}.soft-btn.danger,.mini-btn.danger{color:var(--danger);border-color:#efd9dd;background:#fffafb}.soft-btn:disabled{opacity:.55}.stat{font-size:.76rem;color:#777381;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.panel{border-radius:14px;padding:11px 12px;margin-top:11px;background:rgba(255,255,255,.92)}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px}.search{position:relative}.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#aaa3af;font-size:.84rem}.form-control{border-color:var(--line2);border-radius:8px;font-size:.82rem;padding:6px 9px}.search .form-control{padding-left:32px}.form-control:focus{border-color:#d7bfd0;box-shadow:0 0 0 .15rem rgba(230,170,200,.10)}.filters{margin-top:9px}.filter-btn{border-radius:999px;padding:5px 9px;color:#807987}.filter-btn.active{background:var(--blue);border-color:var(--blue-bd);color:#55758b}
.groups{display:grid;gap:10px;margin-top:11px}.group{border-radius:14px;overflow:hidden}.group-head{min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 11px;background:linear-gradient(90deg,#fbf8fd,#f7fbfe);border-bottom:1px solid var(--lav-bd)}.group-meta{min-width:0;display:flex;align-items:center;gap:8px}.group-folder{color:#9a88aa;font-size:.9rem}.group-title{margin:0;font-size:.92rem;font-weight:800;color:#665d70}.group-count{color:#a29aa8;font-size:.7rem;white-space:nowrap}.group-edit-inline{display:flex;gap:6px;align-items:center;flex:1;max-width:540px}.group-edit-inline input{min-width:120px}
.list-head,.page-row{display:grid;grid-template-columns:28px minmax(130px,.72fr) minmax(240px,1.55fr) minmax(150px,.9fr) 68px;gap:9px;align-items:center}.list-head{padding:5px 11px;color:#aaa4b0;font-size:.66rem;background:#fff;border-bottom:1px solid #f2edf2}.page-row{min-height:38px;padding:4px 11px;border-bottom:1px solid #f3eef3}.page-row:last-child{border-bottom:0}.page-row:hover{background:#fffcfe}.favicon{width:23px;height:23px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;color:#b0aab5;overflow:hidden;font-size:.72rem}.favicon img{width:16px;height:16px;object-fit:contain}.page-link{display:contents;text-decoration:none;color:inherit}.page-name,.page-title,.page-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.page-name{font-weight:760;font-size:.8rem;color:#373544}.page-title{font-size:.72rem;color:#85808c}.page-note{font-size:.72rem;color:#6f6a76}.row-actions{justify-content:flex-end;flex-wrap:nowrap;gap:2px}.icon-action{width:25px;height:25px;border:1px solid transparent;background:transparent;border-radius:7px;color:#938b99;display:grid;place-items:center;font-size:.75rem}.icon-action:hover{background:var(--blue);border-color:var(--blue-bd);color:#55758b}.icon-action.delete:hover{color:var(--danger);background:#fff7f8;border-color:#f0dadd}
.page-editor{grid-column:1/-1;display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(170px,1fr) minmax(130px,.7fr) minmax(150px,.9fr) auto;gap:7px;align-items:end;padding:3px 0}.edit-field label{display:block;font-size:.66rem;color:#919aa7;margin-bottom:3px}.edit-actions{display:flex;gap:5px;align-items:center;padding-bottom:1px}.empty{padding:15px 12px;text-align:center;color:#9e97a4;font-size:.78rem}.hidden{display:none!important}.import-state{font-size:.73rem;color:#8b8591;align-self:center}.status-title{font-size:.96rem;font-weight:800;margin:0 0 4px}.status-text{font-size:.8rem;color:var(--muted);margin:0}.toast{font-size:.8rem}#legacyFrame{display:none}
@media(max-width:900px){.list-head{display:none}.page-row{grid-template-columns:27px minmax(110px,.75fr) minmax(180px,1.3fr) 62px}.page-note{display:none}.page-editor{grid-template-columns:1fr 1fr}.edit-actions{grid-column:1/-1}.toolbar{grid-template-columns:1fr}.group-head{align-items:flex-start}.group-actions{justify-content:flex-end}}
@media(max-width:620px){.app{margin-top:10px}.page-row{grid-template-columns:26px minmax(90px,.8fr) minmax(120px,1.2fr) 58px;padding:5px 8px;gap:6px}.page-title{font-size:.68rem}.page-name{font-size:.76rem}.page-editor{grid-template-columns:1fr}.hero{padding:13px}.group-head{padding:8px}.group-count{display:none}}
</style>
</head>
<body>
<iframe id="legacyFrame" src="./links_legacy.html" aria-hidden="true"></iframe>
<div class="app">
<section class="hero">
<div class="hero-top"><div class="brand"><div class="brand-icon">🐟</div><div><h1>魚魚の收藏夾</h1><p>群組整理常用分頁</p></div></div><div><a class="soft-btn text-decoration-none" href="./index.html"><i class="bi bi-house"></i> 回首頁</a> <button id="logoutBtn" class="soft-btn hidden"><i class="bi bi-box-arrow-right"></i> 登出</button></div></div>
<div id="mainActions" class="actions hidden"><button id="newGroupBtn" class="soft-btn primary"><i class="bi bi-folder-plus"></i> 新增群組</button><button id="importBtn" class="soft-btn import" onclick="document.getElementById('tobyFiles').click()"><i class="bi bi-box-arrow-in-down"></i> 匯入 Toby JSON</button><input id="tobyFiles" class="hidden" type="file" accept=".json,application/json" multiple><span id="importState" class="import-state"></span></div>
<div id="stats" class="stats hidden"><span class="stat" id="groupStat">0 個群組</span><span class="stat" id="pageStat">0 個分頁</span></div>
</section>
<section id="loginPanel" class="panel hidden"><h2 class="status-title">🔐 私人收藏</h2><p class="status-text">只有你的 Google 帳號能使用。</p><button id="googleLoginBtn" class="soft-btn primary mt-2"><i class="bi bi-google"></i> 使用 Google 登入</button></section>
<section id="deniedPanel" class="panel hidden"><h2 class="status-title">⛔ 無法使用</h2><p class="status-text">這個帳號沒有資料存取權限。</p></section>
<section id="toolbar" class="panel hidden"><div class="toolbar"><div class="search"><i class="bi bi-search"></i><input id="searchInput" class="form-control" placeholder="搜尋名稱、網站標題或備註..."></div><button id="refreshBtn" class="soft-btn"><i class="bi bi-arrow-clockwise"></i> 重新整理</button></div><div id="groupFilters" class="filters"></div></section>
<main id="groupsWrap" class="groups"></main>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="d-flex"><div id="toastText" class="toast-body">完成</div><button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script>
let auth,db,user=null,groups=[],pages=[],activeGroup='all',keyword='',editingPageId='',editingGroupId='',addingPageGroupId='',addingGroup=false;
const $=id=>document.getElementById(id),toast=new bootstrap.Toast($('appToast'),{delay:2800});
function visible(id,on){$(id).classList.toggle('hidden',!on)}function msg(text){$('toastText').textContent=text;toast.show()}function esc(v=''){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function normUrl(v=''){let s=String(v).trim();if(!s)return'';return /^https?:\/\//i.test(s)?s:'https://'+s}function favicon(url){try{return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(url)}&sz=64`}catch{return''}}function displayName(p){return String(p.name||'').trim()||String(p.title||'').trim()||'未命名'}function groupsRef(){return db.collection('users').doc(user.uid).collection('groups')}function pagesRef(){return db.collection('users').doc(user.uid).collection('bookmarks')}
async function startFirebase(){try{const frame=$('legacyFrame');const lf=frame.contentWindow.firebase;const cfg=lf.app().options;firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{user=u;const ok=!!u;visible('loginPanel',!ok);visible('logoutBtn',ok);visible('mainActions',ok);visible('stats',ok);visible('toolbar',ok);visible('deniedPanel',false);if(ok)await loadData();else $('groupsWrap').innerHTML=''})}catch(e){console.error(e);msg('Firebase 初始化失敗')}}
$('legacyFrame').addEventListener('load',startFirebase);$('googleLoginBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){console.error(e);msg('登入失敗：'+e.message)}};$('logoutBtn').onclick=()=>auth.signOut();
async function loadData(){try{const[g,p]=await Promise.all([groupsRef().orderBy('sortOrder').get(),pagesRef().orderBy('sortOrder').get()]);groups=g.docs.map(d=>({id:d.id,...d.data()}));pages=p.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.groupId);render()}catch(e){console.error(e);if(e.code==='permission-denied'){visible('deniedPanel',true);visible('mainActions',false);visible('stats',false);visible('toolbar',false)}else msg('讀取失敗：'+e.message)}}
function render(){$('groupStat').textContent=`${groups.length} 個群組`;$('pageStat').textContent=`${pages.length} 個分頁`;renderFilters();renderGroups()}function renderFilters(){let h=`<button class="filter-btn ${activeGroup==='all'?'active':''}" data-id="all">全部</button>`;for(const g of groups)h+=`<button class="filter-btn ${activeGroup===g.id?'active':''}" data-id="${g.id}">${esc(g.name)}</button>`;$('groupFilters').innerHTML=h;$('groupFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeGroup=b.dataset.id;editingPageId='';addingPageGroupId='';renderFilters();renderGroups()})}function hit(p){if(!keyword)return true;return[displayName(p),p.title||'',p.note||''].join(' ').toLowerCase().includes(keyword)}
function groupHeader(g,items){if(editingGroupId===g.id)return `<header class="group-head"><div class="group-edit-inline"><i class="bi bi-folder2 group-folder"></i><input id="groupName_${g.id}" class="form-control" value="${esc(g.name)}"><button class="mini-btn primary" onclick="saveGroup('${g.id}')"><i class="bi bi-check-lg"></i> 儲存</button><button class="mini-btn" onclick="cancelGroupEdit()">取消</button><button class="mini-btn danger" onclick="deleteGroup('${g.id}')"><i class="bi bi-trash3"></i></button></div></header>`;return `<header class="group-head"><div class="group-meta"><i class="bi bi-folder2 group-folder"></i><h2 class="group-title">${esc(g.name)}</h2><span class="group-count">${items.length} 個分頁</span></div><div class="group-actions"><button class="mini-btn primary" onclick="startAddPage('${g.id}')"><i class="bi bi-plus-lg"></i> 分頁</button><button class="icon-action" title="編輯群組" onclick="startGroupEdit('${g.id}')"><i class="bi bi-pencil"></i></button></div></header>`}
function normalRow(p){const name=displayName(p),title=String(p.title||'').trim()||name,f=favicon(p.url),note=String(p.note||'').trim();return `<div class="page-row"><div class="favicon">${f?`<img src="${esc(f)}" alt="" onerror="this.remove();this.parentNode.innerHTML='<i class=&quot;bi bi-globe2&quot;></i>'">`:'<i class="bi bi-globe2"></i>'}</div><a class="page-link" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="page-name" title="${esc(name)}">${esc(name)}</div><div class="page-title" title="${esc(title)}">${esc(title)}</div><div class="page-note" title="${esc(note)}">${note?esc(note):'<span style="color:#b7b0ba">—</span>'}</div></a><div class="row-actions"><button class="icon-action" title="編輯" onclick="startPageEdit('${p.id}')"><i class="bi bi-pencil"></i></button><button class="icon-action delete" title="刪除" onclick="deletePage('${p.id}')"><i class="bi bi-trash3"></i></button></div></div>`}
function editorRow(p={},groupId,isNew=false){const id=p.id||'new';return `<div class="page-row"><div class="page-editor"><div class="edit-field"><label>網址</label><input id="editUrl_${id}" class="form-control" value="${esc(p.url||'')}" placeholder="https://..."></div><div class="edit-field"><label>網站標題</label><input id="editTitle_${id}" class="form-control" value="${esc(p.title||'')}" placeholder="網站原本標題"></div><div class="edit-field"><label>名稱</label><input id="editName_${id}" class="form-control" value="${esc(p.name||'')}" placeholder="可留空"></div><div class="edit-field"><label>備註</label><input id="editNote_${id}" class="form-control" value="${esc(p.note||'')}" placeholder="可留空"></div><div class="edit-actions"><button class="mini-btn primary" onclick="savePage('${isNew?'':p.id}','${groupId}')"><i class="bi bi-check-lg"></i> 儲存</button><button class="mini-btn" onclick="cancelPageEdit()">取消</button>${isNew?'':`<button class="mini-btn danger" onclick="deletePage('${p.id}')"><i class="bi bi-trash3"></i></button>`}</div></div></div>`}
function renderGroups(){if(!groups.length&&!addingGroup){$('groupsWrap').innerHTML='<section class="group"><div class="empty">目前還沒有群組</div></section>';return}let h='';if(addingGroup)h+=`<section class="group"><header class="group-head"><div class="group-edit-inline"><i class="bi bi-folder-plus group-folder"></i><input id="newGroupName" class="form-control" placeholder="群組名稱"><button class="mini-btn primary" onclick="saveNewGroup()"><i class="bi bi-check-lg"></i> 新增</button><button class="mini-btn" onclick="cancelNewGroup()">取消</button></div></header></section>`;for(const g of groups.filter(x=>activeGroup==='all'||activeGroup===x.id)){const items=pages.filter(p=>p.groupId===g.id&&hit(p));if(keyword&&!items.length)continue;h+=`<section class="group">${groupHeader(g,items)}<div class="list-head"><span></span><span>名稱</span><span>網站標題</span><span>備註</span><span style="text-align:right">操作</span></div>${addingPageGroupId===g.id?editorRow({},g.id,true):''}${items.length?items.map(p=>editingPageId===p.id?editorRow(p,g.id,false):normalRow(p)).join(''):(addingPageGroupId===g.id?'':'<div class="empty">這個群組還沒有分頁</div>')}</section>`}$('groupsWrap').innerHTML=h||'<section class="group"><div class="empty">找不到符合的分頁</div></section>'}
$('searchInput').oninput=e=>{keyword=e.target.value.trim().toLowerCase();renderGroups()};$('refreshBtn').onclick=loadData;$('newGroupBtn').onclick=()=>{addingGroup=true;editingGroupId='';renderGroups();setTimeout(()=>$('newGroupName')?.focus(),30)};
window.cancelNewGroup=()=>{addingGroup=false;renderGroups()};window.saveNewGroup=async()=>{const name=$('newGroupName')?.value.trim();if(!name)return msg('請輸入群組名稱');try{await groupsRef().add({name,sortOrder:groups.length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});addingGroup=false;await loadData()}catch(e){msg('新增失敗：'+e.message)}};window.startGroupEdit=id=>{editingGroupId=id;addingGroup=false;renderGroups();setTimeout(()=>$(`groupName_${id}`)?.focus(),30)};window.cancelGroupEdit=()=>{editingGroupId='';renderGroups()};window.saveGroup=async id=>{const name=$(`groupName_${id}`)?.value.trim();if(!name)return msg('群組名稱不能空白');try{await groupsRef().doc(id).update({name});editingGroupId='';await loadData()}catch(e){msg('儲存失敗：'+e.message)}};window.deleteGroup=async id=>{const g=groups.find(x=>x.id===id);if(!g||!confirm(`確定刪除「${g.name}」和裡面的所有分頁？`))return;try{const related=pages.filter(p=>p.groupId===id);for(let i=0;i<related.length;i+=400){const b=db.batch();related.slice(i,i+400).forEach(p=>b.delete(pagesRef().doc(p.id)));await b.commit()}await groupsRef().doc(id).delete();editingGroupId='';activeGroup='all';await loadData()}catch(e){msg('刪除失敗：'+e.message)}};
window.startAddPage=groupId=>{addingPageGroupId=groupId;editingPageId='';renderGroups();setTimeout(()=>$('editUrl_new')?.focus(),30)};window.startPageEdit=id=>{editingPageId=id;addingPageGroupId='';renderGroups();setTimeout(()=>$(`editName_${id}`)?.focus(),30)};window.cancelPageEdit=()=>{editingPageId='';addingPageGroupId='';renderGroups()};window.savePage=async(id,groupId)=>{const key=id||'new',url=normUrl($(`editUrl_${key}`)?.value||''),title=($(`editTitle_${key}`)?.value||'').trim(),name=($(`editName_${key}`)?.value||'').trim(),note=($(`editNote_${key}`)?.value||'').trim();if(!url)return msg('請輸入網址');if(!title)return msg('請輸入網站標題');const data={groupId,url,title,name,note};try{id?await pagesRef().doc(id).update(data):await pagesRef().add({...data,sortOrder:pages.filter(x=>x.groupId===groupId).length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});editingPageId='';addingPageGroupId='';await loadData()}catch(e){msg('儲存失敗：'+e.message)}};window.deletePage=async id=>{const p=pages.find(x=>x.id===id);if(!p||!confirm(`確定刪除「${displayName(p)}」？`))return;try{await pagesRef().doc(id).delete();editingPageId='';await loadData()}catch(e){msg('刪除失敗：'+e.message)}};
$('tobyFiles').addEventListener('change',async e=>{const files=[...(e.target.files||[])];e.target.value='';if(!files.length)return;$('importBtn').disabled=true;let newGroups=0,newPages=0,skipped=0,failed=[];const urlCache=new Map(),countCache=new Map();for(const g of groups){const gp=pages.filter(p=>p.groupId===g.id);urlCache.set(g.id,new Set(gp.map(p=>p.url)));countCache.set(g.id,gp.length)}for(let i=0;i<files.length;i++){const file=files[i];$('importState').textContent=`匯入中 ${i+1}/${files.length}：${file.name}`;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.lists)||!data.lists.length){skipped++;continue}const validLists=data.lists.filter(list=>list&&Array.isArray(list.cards));if(!validLists.length){skipped++;continue}for(let li=0;li<validLists.length;li++){const list=validLists[li],fallback=`${file.name.replace(/\.json$/i,'')} ${li+1}`,groupName=String(list.title||fallback).trim()||fallback;let group=groups.find(g=>g.name.trim().toLowerCase()===groupName.toLowerCase());if(!group){const ref=await groupsRef().add({name:groupName,sortOrder:groups.length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});group={id:ref.id,name:groupName};groups.push(group);urlCache.set(group.id,new Set());countCache.set(group.id,0);newGroups++}if(!urlCache.has(group.id)){const gp=pages.filter(p=>p.groupId===group.id);urlCache.set(group.id,new Set(gp.map(p=>p.url)));countCache.set(group.id,gp.length)}const existing=urlCache.get(group.id),rows=[];let baseCount=countCache.get(group.id)||0;for(const card of list.cards){const url=normUrl(card?.url);if(!url||existing.has(url))continue;const title=String(card?.title||'').trim()||url,name=String(card?.customTitle||'').trim();rows.push({groupId:group.id,url,title,name,note:'',sortOrder:baseCount+rows.length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});existing.add(url)}for(let n=0;n<rows.length;n+=400){const batch=db.batch();rows.slice(n,n+400).forEach(row=>batch.set(pagesRef().doc(),row));await batch.commit()}countCache.set(group.id,baseCount+rows.length);newPages+=rows.length}}catch(err){console.error('[Toby Import]',file.name,err);failed.push(file.name)}}await loadData();$('importBtn').disabled=false;let text=`完成：${newGroups} 個新群組、${newPages} 個分頁`;if(skipped)text+=`，略過 ${skipped} 個非 Toby JSON`;if(failed.length)text+=`，${failed.length} 個檔案失敗`;$('importState').textContent=text;msg(text)});
</script>
</body>
</html>
