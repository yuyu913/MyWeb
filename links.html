<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魚魚の收藏夾 🔖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#fff8fb;--white:rgba(255,255,255,.96);--line:#eee8ef;--line2:#e3dce6;--text:#2f3040;--muted:#8f8b99;--pink:#fff0f6;--pink-bd:#f6d8e5;--blue:#f1f8fd;--blue-bd:#d8e9f4;--lav:#faf7fc;--lav-bd:#e8dff0;--danger:#b85f6b;--shadow:0 7px 22px rgba(49,39,55,.055)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;background:radial-gradient(900px 450px at 8% 0%,rgba(255,181,210,.20),transparent 55%),radial-gradient(850px 420px at 92% 8%,rgba(173,220,250,.22),transparent 55%),radial-gradient(900px 500px at 50% 100%,rgba(255,225,133,.14),transparent 55%),var(--bg)}
.app{max-width:1320px;margin:18px auto 50px;padding:0 14px}.hero,.panel,.group{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:16px;padding:14px 17px;background:linear-gradient(100deg,rgba(255,240,246,.82),rgba(241,248,253,.82),rgba(255,249,232,.58)),var(--white)}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.brand-icon{width:39px;height:39px;border-radius:11px;display:grid;place-items:center;font-size:20px;border:1px solid var(--pink-bd);background:linear-gradient(135deg,var(--pink),var(--blue))}.hero h1{font-size:1.38rem;font-weight:850;margin:0}.hero-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px}.soft-btn,.mini-btn{border:1px solid var(--line2);background:#fff;color:#5f5d69;border-radius:9px;padding:6px 9px;font-size:.8rem;display:inline-flex;gap:5px;align-items:center;line-height:1.2}.soft-btn:hover,.mini-btn:hover{background:#fffafd}.soft-btn.primary,.mini-btn.primary{background:var(--pink);border-color:var(--pink-bd);color:#86546a}.soft-btn.danger,.mini-btn.danger{color:var(--danger);border-color:#efd9dd;background:#fffafb}.stat{font-size:.76rem;color:#777381;background:rgba(255,255,255,.76);border:1px solid var(--line);border-radius:999px;padding:5px 9px}.panel{border-radius:14px;padding:10px 12px;margin-top:11px;background:rgba(255,255,255,.92)}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px}.search{position:relative}.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#aaa3af;font-size:.84rem}.form-control{border-color:var(--line2);border-radius:8px;font-size:.8rem;padding:5px 8px}.search .form-control{padding-left:32px}.form-control:focus{border-color:#d7bfd0;box-shadow:0 0 0 .15rem rgba(230,170,200,.10)}
.groups{display:grid;gap:10px;margin-top:11px}.group{border-radius:14px;overflow:hidden}.group-head{min-height:42px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(90deg,#fcf8fd,#f8fbfe);border-bottom:1px solid var(--lav-bd)}.group-meta{min-width:0;display:flex;align-items:center;gap:8px}.group-folder{color:#9a88aa;font-size:.9rem}.group-title{margin:0;font-size:.92rem;font-weight:800;color:#665d70}.group-count{color:#a29aa8;font-size:.7rem;white-space:nowrap}.group-actions,.row-actions,.group-edit-inline,.edit-actions{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}.group-edit-inline{flex:1;max-width:540px}.group-edit-inline input{min-width:120px}.page-row{display:grid;grid-template-columns:28px minmax(130px,.72fr) minmax(260px,1.55fr) minmax(150px,.9fr) 62px;gap:9px;align-items:center;min-height:35px;padding:3px 10px;border-bottom:1px solid #f3eef3}.page-row:last-child{border-bottom:0}.page-row:hover{background:#fffcfe}.favicon{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;color:#b0aab5;overflow:hidden;font-size:.7rem}.favicon img{width:16px;height:16px;object-fit:contain}.page-link{display:contents;text-decoration:none;color:inherit}.page-name,.page-title,.page-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:default}.page-name{font-weight:760;font-size:.79rem;color:#373544}.page-title{font-size:.71rem;color:#85808c}.page-note{font-size:.71rem;color:#6f6a76}.row-actions{justify-content:flex-end;gap:1px}.icon-action{width:24px;height:24px;border:1px solid transparent;background:transparent;border-radius:7px;color:#938b99;display:grid;place-items:center;font-size:.73rem}.icon-action:hover{background:var(--blue);border-color:var(--blue-bd);color:#55758b}.icon-action.delete:hover{color:var(--danger);background:#fff7f8;border-color:#f0dadd}.inline-edit{grid-column:2/-1;display:grid;grid-template-columns:minmax(160px,.8fr) minmax(220px,1.2fr) auto;gap:7px;align-items:center}.add-editor{grid-column:1/-1;display:grid;grid-template-columns:minmax(210px,1.15fr) minmax(210px,1.15fr) minmax(150px,.7fr) minmax(180px,.9fr) auto;gap:7px;align-items:center;padding:2px 0}.empty{padding:14px 12px;text-align:center;color:#9e97a4;font-size:.78rem}.hidden{display:none!important}.status-title{font-size:.96rem;font-weight:800;margin:0 0 4px}.status-text{font-size:.8rem;color:var(--muted);margin:0}.toast{font-size:.8rem}#legacyFrame{display:none}
@media(max-width:900px){.page-row{grid-template-columns:27px minmax(110px,.75fr) minmax(180px,1.3fr) 60px}.page-note{display:none}.inline-edit{grid-column:2/-1;grid-template-columns:1fr 1fr auto}.add-editor{grid-template-columns:1fr 1fr}.add-editor .edit-actions{grid-column:1/-1}.toolbar{grid-template-columns:1fr}}
@media(max-width:620px){.app{margin-top:10px}.page-row{grid-template-columns:26px minmax(95px,.8fr) minmax(120px,1.2fr) 56px;padding:4px 8px;gap:6px}.page-title{font-size:.67rem}.page-name{font-size:.75rem}.inline-edit{grid-column:1/-1;grid-template-columns:1fr}.add-editor{grid-template-columns:1fr}.hero{padding:12px}.group-head{padding:7px 8px}.group-count{display:none}}
</style>
</head>
<body>
<iframe id="legacyFrame" src="./links_legacy.html" aria-hidden="true"></iframe>
<div class="app">
<section class="hero">
<div class="hero-top"><div class="brand"><div class="brand-icon">🐟</div><h1>魚魚の收藏夾</h1></div><div><a class="soft-btn text-decoration-none" href="./index.html"><i class="bi bi-house"></i> 回首頁</a> <button id="logoutBtn" class="soft-btn hidden"><i class="bi bi-box-arrow-right"></i> 登出</button></div></div>
<div id="mainActions" class="hero-actions hidden"><button id="newGroupBtn" class="soft-btn primary"><i class="bi bi-folder-plus"></i> 新增群組</button><span class="stat" id="groupStat">0 個群組</span><span class="stat" id="pageStat">0 個分頁</span></div>
</section>
<section id="loginPanel" class="panel hidden"><h2 class="status-title">🔐 私人收藏</h2><p class="status-text">只有你的 Google 帳號能使用。</p><button id="googleLoginBtn" class="soft-btn primary mt-2"><i class="bi bi-google"></i> 使用 Google 登入</button></section>
<section id="toolbar" class="panel hidden"><div class="toolbar"><div class="search"><i class="bi bi-search"></i><input id="searchInput" class="form-control" placeholder="搜尋名稱、網站標題或備註..."></div><button id="refreshBtn" class="soft-btn"><i class="bi bi-arrow-clockwise"></i> 重新整理</button></div></section>
<main id="groupsWrap" class="groups"></main>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="d-flex"><div id="toastText" class="toast-body">完成</div><button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script>
const ALLOWED_UID='zK8b0EzOBzbioXBqbgnRaF5uJJ22';
let auth,db,user=null,groups=[],pages=[],keyword='',editingPageId='',editingGroupId='',addingPageGroupId='',addingGroup=false;
const $=id=>document.getElementById(id),toast=new bootstrap.Toast($('appToast'),{delay:2800});
function visible(id,on){$(id).classList.toggle('hidden',!on)}
function msg(text){$('toastText').textContent=text;toast.show()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normUrl(v=''){let s=String(v).trim();if(!s)return'';return /^https?:\/\//i.test(s)?s:'https://'+s}
function favicon(url){return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(url)}&sz=64`}
function displayName(p){return String(p.name||'').trim()||String(p.title||'').trim()||'未命名'}
function groupsRef(){return db.collection('users').doc(user.uid).collection('groups')}
function pagesRef(){return db.collection('users').doc(user.uid).collection('bookmarks')}
async function startFirebase(){try{const frame=$('legacyFrame'),lf=frame.contentWindow.firebase,cfg=lf.app().options;firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{if(u&&u.uid!==ALLOWED_UID){msg('這個 Google 帳號沒有使用權限');await auth.signOut();return}user=u;const ok=!!u;visible('loginPanel',!ok);visible('logoutBtn',ok);visible('mainActions',ok);visible('toolbar',ok);if(ok)await loadData();else $('groupsWrap').innerHTML=''})}catch(e){console.error(e);msg('Firebase 初始化失敗')}}
$('legacyFrame').addEventListener('load',startFirebase);
$('googleLoginBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){console.error(e);msg('登入失敗：'+e.message)}};
$('logoutBtn').onclick=()=>auth.signOut();
async function loadData(){try{const[g,p]=await Promise.all([groupsRef().orderBy('sortOrder').get(),pagesRef().orderBy('sortOrder').get()]);groups=g.docs.map(d=>({id:d.id,...d.data()}));pages=p.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.groupId);render()}catch(e){console.error(e);msg('讀取失敗：'+e.message)}}
function render(){$('groupStat').textContent=`${groups.length} 個群組`;$('pageStat').textContent=`${pages.length} 個分頁`;renderGroups()}
function hit(p){if(!keyword)return true;return[displayName(p),p.title||'',p.note||''].join(' ').toLowerCase().includes(keyword)}
function groupHeader(g,items){if(editingGroupId===g.id)return `<header class="group-head"><div class="group-edit-inline"><i class="bi bi-folder2 group-folder"></i><input id="groupName_${g.id}" class="form-control" value="${esc(g.name)}"><button class="mini-btn primary" onclick="saveGroup('${g.id}')"><i class="bi bi-check-lg"></i> 儲存</button><button class="mini-btn" onclick="cancelGroupEdit()">取消</button><button class="mini-btn danger" onclick="deleteGroup('${g.id}')"><i class="bi bi-trash3"></i></button></div></header>`;return `<header class="group-head"><div class="group-meta"><i class="bi bi-folder2 group-folder"></i><h2 class="group-title" title="${esc(g.name)}">${esc(g.name)}</h2><span class="group-count">${items.length} 個分頁</span></div><div class="group-actions"><button class="mini-btn primary" onclick="startAddPage('${g.id}')"><i class="bi bi-plus-lg"></i> 分頁</button><button class="icon-action" title="編輯群組" onclick="startGroupEdit('${g.id}')"><i class="bi bi-pencil"></i></button></div></header>`}
function normalRow(p){const name=displayName(p),title=String(p.title||'').trim()||name,note=String(p.note||'').trim(),f=favicon(p.url);return `<div class="page-row"><div class="favicon"><img src="${esc(f)}" alt="" onerror="this.remove();this.parentNode.innerHTML='<i class=&quot;bi bi-globe2&quot;></i>'"></div><a class="page-link" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="page-name" title="${esc(name)}">${esc(name)}</div><div class="page-title" title="${esc(title)}">${esc(title)}</div><div class="page-note" title="${esc(note)}">${esc(note)}</div></a><div class="row-actions"><button class="icon-action" title="編輯" onclick="startPageEdit('${p.id}')"><i class="bi bi-pencil"></i></button><button class="icon-action delete" title="刪除" onclick="deletePage('${p.id}')"><i class="bi bi-trash3"></i></button></div></div>`}
function editRow(p){const f=favicon(p.url);return `<div class="page-row"><div class="favicon"><img src="${esc(f)}" alt="" onerror="this.remove();this.parentNode.innerHTML='<i class=&quot;bi bi-globe2&quot;></i>'"></div><div class="inline-edit"><input id="editName_${p.id}" class="form-control" value="${esc(p.name||'')}" placeholder="名稱（留空沿用網站標題）"><input id="editNote_${p.id}" class="form-control" value="${esc(p.note||'')}" placeholder="備註"><div class="edit-actions"><button class="mini-btn primary" onclick="savePageEdit('${p.id}')"><i class="bi bi-check-lg"></i> 儲存</button><button class="mini-btn" onclick="cancelPageEdit()">取消</button><button class="mini-btn danger" onclick="deletePage('${p.id}')"><i class="bi bi-trash3"></i></button></div></div></div>`}
function addRow(groupId){return `<div class="page-row"><div class="add-editor"><input id="newUrl_${groupId}" class="form-control" placeholder="網址"><input id="newTitle_${groupId}" class="form-control" placeholder="網站標題"><input id="newName_${groupId}" class="form-control" placeholder="名稱（可留空）"><input id="newNote_${groupId}" class="form-control" placeholder="備註（可留空）"><div class="edit-actions"><button class="mini-btn primary" onclick="saveNewPage('${groupId}')"><i class="bi bi-check-lg"></i> 儲存</button><button class="mini-btn" onclick="cancelPageEdit()">取消</button></div></div></div>`}
function renderGroups(){if(!groups.length&&!addingGroup){$('groupsWrap').innerHTML='<section class="group"><div class="empty">目前還沒有群組</div></section>';return}let h='';if(addingGroup)h+=`<section class="group"><header class="group-head"><div class="group-edit-inline"><i class="bi bi-folder-plus group-folder"></i><input id="newGroupName" class="form-control" placeholder="群組名稱"><button class="mini-btn primary" onclick="saveNewGroup()"><i class="bi bi-check-lg"></i> 新增</button><button class="mini-btn" onclick="cancelNewGroup()">取消</button></div></header></section>`;for(const g of groups){const items=pages.filter(p=>p.groupId===g.id&&hit(p));if(keyword&&!items.length)continue;h+=`<section class="group">${groupHeader(g,items)}${addingPageGroupId===g.id?addRow(g.id):''}${items.length?items.map(p=>editingPageId===p.id?editRow(p):normalRow(p)).join(''):(addingPageGroupId===g.id?'':'<div class="empty">這個群組還沒有分頁</div>')}</section>`}$('groupsWrap').innerHTML=h||'<section class="group"><div class="empty">找不到符合的分頁</div></section>'}
$('searchInput').oninput=e=>{keyword=e.target.value.trim().toLowerCase();renderGroups()};
$('refreshBtn').onclick=loadData;
$('newGroupBtn').onclick=()=>{addingGroup=true;editingGroupId='';renderGroups();setTimeout(()=>$('newGroupName')?.focus(),30)};
window.cancelNewGroup=()=>{addingGroup=false;renderGroups()};
window.saveNewGroup=async()=>{const name=$('newGroupName')?.value.trim();if(!name)return msg('請輸入群組名稱');try{await groupsRef().add({name,sortOrder:groups.length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});addingGroup=false;await loadData()}catch(e){msg('新增失敗：'+e.message)}};
window.startGroupEdit=id=>{editingGroupId=id;addingGroup=false;renderGroups();setTimeout(()=>$(`groupName_${id}`)?.focus(),30)};
window.cancelGroupEdit=()=>{editingGroupId='';renderGroups()};
window.saveGroup=async id=>{const name=$(`groupName_${id}`)?.value.trim();if(!name)return msg('群組名稱不能空白');try{await groupsRef().doc(id).update({name});editingGroupId='';await loadData()}catch(e){msg('儲存失敗：'+e.message)}};
window.deleteGroup=async id=>{const g=groups.find(x=>x.id===id);if(!g||!confirm(`確定刪除「${g.name}」和裡面的所有分頁？`))return;try{const related=pages.filter(p=>p.groupId===id);for(let i=0;i<related.length;i+=400){const b=db.batch();related.slice(i,i+400).forEach(p=>b.delete(pagesRef().doc(p.id)));await b.commit()}await groupsRef().doc(id).delete();editingGroupId='';await loadData()}catch(e){msg('刪除失敗：'+e.message)}};
window.startAddPage=groupId=>{addingPageGroupId=groupId;editingPageId='';renderGroups();setTimeout(()=>$(`newUrl_${groupId}`)?.focus(),30)};
window.startPageEdit=id=>{editingPageId=id;addingPageGroupId='';renderGroups();setTimeout(()=>$(`editName_${id}`)?.focus(),30)};
window.cancelPageEdit=()=>{editingPageId='';addingPageGroupId='';renderGroups()};
window.savePageEdit=async id=>{const p=pages.find(x=>x.id===id);if(!p)return;const name=($(`editName_${id}`)?.value||'').trim(),note=($(`editNote_${id}`)?.value||'').trim();try{await pagesRef().doc(id).update({name,note});editingPageId='';await loadData()}catch(e){msg('儲存失敗：'+e.message)}};
window.saveNewPage=async groupId=>{const url=normUrl($(`newUrl_${groupId}`)?.value||''),title=($(`newTitle_${groupId}`)?.value||'').trim(),name=($(`newName_${groupId}`)?.value||'').trim(),note=($(`newNote_${groupId}`)?.value||'').trim();if(!url)return msg('請輸入網址');if(!title)return msg('請輸入網站標題');try{await pagesRef().add({groupId,url,title,name,note,sortOrder:pages.filter(x=>x.groupId===groupId).length,createdAt:firebase.firestore.FieldValue.serverTimestamp()});addingPageGroupId='';await loadData()}catch(e){msg('新增失敗：'+e.message)}};
window.deletePage=async id=>{const p=pages.find(x=>x.id===id);if(!p||!confirm(`確定刪除「${displayName(p)}」？`))return;try{await pagesRef().doc(id).delete();editingPageId='';await loadData()}catch(e){msg('刪除失敗：'+e.message)}};
</script>
</body>
</html>
