<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>魚魚の收藏夾 🔖</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #fff7fb;
            --card: rgba(255,255,255,.88);
            --stroke: rgba(16,24,40,.08);
            --text: #1f2937;
            --muted: #6b7280;
            --pink-bg: rgba(255,111,177,.12);
            --pink-bd: rgba(255,111,177,.28);
            --pink-tx: #7a284f;
            --blue-bg: rgba(107,199,255,.14);
            --blue-bd: rgba(107,199,255,.32);
            --blue-tx: #0f3a56;
            --yellow-bg: rgba(255,211,77,.20);
            --yellow-bd: rgba(255,211,77,.45);
            --yellow-tx: #6b4b00;
            --gray-bg: rgba(16,24,40,.05);
            --gray-bd: rgba(16,24,40,.10);
            --gray-tx: #374151;
            --shadow: 0 10px 30px rgba(16,24,40,.08);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(1200px 600px at 10% 0%, rgba(255,111,177,.14), transparent 50%),
                radial-gradient(900px 500px at 90% 10%, rgba(107,199,255,.16), transparent 50%),
                radial-gradient(1000px 600px at 50% 100%, rgba(255,211,77,.14), transparent 50%),
                var(--bg);
        }
        a { color: inherit; }
        .app-shell { max-width: 1180px; margin: 24px auto 64px; padding: 0 14px; }
        .hero {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--stroke);
            border-radius: 22px;
            background: rgba(255,255,255,.70);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: -2px;
            z-index: 0;
            background: linear-gradient(90deg, rgba(255,111,177,.22), rgba(107,199,255,.22), rgba(255,211,77,.22));
            filter: blur(18px);
        }
        .hero-inner { position: relative; z-index: 1; padding: 20px; background: rgba(255,255,255,.78); }
        .title-wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .sparkle {
            width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center;
            font-size: 24px; border: 1px solid var(--stroke);
            background: linear-gradient(135deg, rgba(255,111,177,.18), rgba(107,199,255,.18));
        }
        .hero-title { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); font-weight: 900; letter-spacing: .2px; }
        .hero-sub { margin: 3px 0 0; color: var(--muted); font-size: .95rem; }
        .hero-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .soft-btn {
            border: 1px solid var(--stroke); border-radius: 999px; padding: 8px 13px;
            background: rgba(255,255,255,.8); color: var(--text); font-size: .9rem;
            display: inline-flex; align-items: center; gap: 7px; transition: .18s ease;
        }
        .soft-btn:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(16,24,40,.08); }
        .soft-btn.pink { border-color: var(--pink-bd); background: var(--pink-bg); color: var(--pink-tx); }
        .soft-btn.blue { border-color: var(--blue-bd); background: var(--blue-bg); color: var(--blue-tx); }
        .soft-btn.yellow { border-color: var(--yellow-bd); background: var(--yellow-bg); color: var(--yellow-tx); }
        .soft-btn.gray { border-color: var(--gray-bd); background: var(--gray-bg); color: var(--gray-tx); }
        .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
        .chip {
            border: 1px dashed var(--pink-bd); background: rgba(255,240,247,.72); color: var(--pink-tx);
            border-radius: 999px; padding: 6px 10px; font-size: .85rem; display: inline-flex; gap: 6px; align-items: center;
        }
        .chip.blue { border-color: var(--blue-bd); background: var(--blue-bg); color: var(--blue-tx); }
        .chip.yellow { border-color: var(--yellow-bd); background: var(--yellow-bg); color: var(--yellow-tx); }
        .status-card, .toolbar-card, .group-card {
            border: 1px solid var(--stroke); border-radius: 18px; background: var(--card);
            backdrop-filter: blur(10px); box-shadow: 0 10px 26px rgba(16,24,40,.06);
        }
        .status-card { padding: 18px; margin-top: 14px; }
        .status-title { margin: 0 0 6px; font-weight: 850; font-size: 1.05rem; }
        .status-text { margin: 0; color: var(--muted); font-size: .92rem; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
        .setup-grid .full { grid-column: 1 / -1; }
        .form-control, .form-select {
            border-radius: 13px; border-color: rgba(16,24,40,.12); padding: 9px 12px;
        }
        .form-control:focus, .form-select:focus { border-color: rgba(255,111,177,.38); box-shadow: 0 0 0 .2rem rgba(255,111,177,.10); }
        .toolbar-card { padding: 14px; margin-top: 14px; }
        .toolbar-top { display: grid; grid-template-columns: minmax(200px,1fr) auto; gap: 10px; align-items: center; }
        .search-wrap { position: relative; }
        .search-wrap i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .search-wrap input { padding-left: 38px; }
        .group-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .group-pill {
            border-radius: 999px; border: 1px solid var(--stroke); background: rgba(255,255,255,.75);
            color: var(--muted); padding: 7px 11px; font-size: .86rem; transition: .18s ease;
        }
        .group-pill.active { background: linear-gradient(135deg, var(--pink-bg), var(--blue-bg)); color: var(--text); border-color: var(--pink-bd); }
        .groups-wrap { margin-top: 14px; display: grid; gap: 14px; }
        .group-card { overflow: hidden; }
        .group-head {
            padding: 14px 16px; border-bottom: 1px solid var(--stroke);
            background: linear-gradient(90deg, rgba(255,111,177,.10), rgba(107,199,255,.10), rgba(255,211,77,.10));
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .group-title-wrap { min-width: 0; }
        .group-title { margin: 0; font-weight: 900; font-size: 1.05rem; overflow-wrap: anywhere; }
        .group-count { color: var(--muted); font-size: .82rem; margin-top: 2px; }
        .group-actions { display: flex; gap: 7px; flex: 0 0 auto; }
        .icon-btn {
            width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px;
            border: 1px solid var(--stroke); background: rgba(255,255,255,.78); color: #4b5563;
        }
        .icon-btn:hover { background: #fff; }
        .bookmark-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; padding: 12px; }
        .bookmark-card {
            position: relative; min-width: 0; border: 1px solid var(--stroke); border-radius: 16px;
            background: rgba(255,255,255,.82); padding: 12px 44px 12px 12px;
            display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 10px; transition: .18s ease;
        }
        .bookmark-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(16,24,40,.08); }
        .bookmark-main { text-decoration: none; min-width: 0; display: contents; }
        .favicon-box {
            width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--stroke); background: #fff;
            display: grid; place-items: center; overflow: hidden; font-weight: 800; color: var(--pink-tx);
        }
        .favicon-box img { width: 22px; height: 22px; object-fit: contain; }
        .bookmark-info { min-width: 0; }
        .bookmark-title { margin: 0; font-size: .95rem; line-height: 1.35; font-weight: 800; overflow-wrap: anywhere; }
        .bookmark-domain { color: var(--muted); font-size: .78rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bookmark-desc { color: #596273; font-size: .83rem; margin: 6px 0 0; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
        .tag {
            border-radius: 999px; padding: 3px 7px; font-size: .72rem; color: var(--blue-tx);
            background: var(--blue-bg); border: 1px solid var(--blue-bd);
        }
        .bookmark-edit { position: absolute; top: 10px; right: 10px; }
        .empty-box { padding: 32px 16px; text-align: center; color: var(--muted); }
        .empty-icon { font-size: 2rem; margin-bottom: 6px; }
        .modal-content { border: 1px solid var(--stroke); border-radius: 20px; box-shadow: var(--shadow); }
        .modal-header { border-bottom-color: var(--stroke); background: linear-gradient(90deg, var(--pink-bg), var(--blue-bg), var(--yellow-bg)); }
        .modal-footer { border-top-color: var(--stroke); }
        .help-text { color: var(--muted); font-size: .8rem; }
        .hidden { display: none !important; }
        .toast-container { z-index: 2000; }
        @media (max-width: 760px) {
            .app-shell { margin-top: 12px; }
            .bookmark-grid { grid-template-columns: 1fr; }
            .toolbar-top { grid-template-columns: 1fr; }
            .setup-grid { grid-template-columns: 1fr; }
            .setup-grid .full { grid-column: auto; }
            .hero-inner { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <section class="hero">
        <div class="hero-inner">
            <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                <div class="title-wrap">
                    <div class="sparkle">🐟</div>
                    <div>
                        <h1 class="hero-title">魚魚の收藏夾 🔖</h1>
                        <p class="hero-sub">把之後還會用到的頁面分組收好，不再被分頁淹沒</p>
                    </div>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a class="soft-btn gray text-decoration-none" href="./index.html"><i class="bi bi-house"></i> 回首頁</a>
                    <button id="logoutBtn" class="soft-btn gray hidden" type="button"><i class="bi bi-box-arrow-right"></i> 登出</button>
                </div>
            </div>
            <div id="mainActions" class="hero-tools hidden">
                <button class="soft-btn pink" type="button" data-bs-toggle="modal" data-bs-target="#groupModal" onclick="openGroupModal()"><i class="bi bi-folder-plus"></i> 新增分組</button>
                <button class="soft-btn blue" type="button" data-bs-toggle="modal" data-bs-target="#bookmarkModal" onclick="openBookmarkModal()"><i class="bi bi-plus-circle"></i> 新增網址</button>
                <button class="soft-btn yellow" type="button" onclick="document.getElementById('tobyFile').click()"><i class="bi bi-box-arrow-in-down"></i> 匯入 Toby</button>
                <input id="tobyFile" class="hidden" type="file" accept="application/json,.json">
            </div>
            <div id="stats" class="stat-row hidden">
                <span class="chip"><i class="bi bi-folder2"></i><span id="groupStat">0 個分組</span></span>
                <span class="chip blue"><i class="bi bi-link-45deg"></i><span id="linkStat">0 個網址</span></span>
                <span class="chip yellow"><i class="bi bi-tags"></i><span id="tagStat">0 個標籤</span></span>
            </div>
        </div>
    </section>

    <section id="setupPanel" class="status-card hidden">
        <h2 class="status-title">🔧 第一次使用：連接 Supabase</h2>
        <p class="status-text">只需要設定一次。這兩個值是 Supabase 前端連線資訊，資料安全仍由 Row Level Security（資料列層級安全性）保護。</p>
        <div class="setup-grid">
            <div>
                <label class="form-label small fw-bold" for="supabaseUrl">Project URL</label>
                <input id="supabaseUrl" class="form-control" type="url" placeholder="https://xxxxx.supabase.co">
            </div>
            <div>
                <label class="form-label small fw-bold" for="supabaseKey">Anon / Publishable Key</label>
                <input id="supabaseKey" class="form-control" type="text" placeholder="eyJ...">
            </div>
            <div class="full d-flex flex-wrap gap-2 align-items-center">
                <button id="saveConfigBtn" class="soft-btn pink" type="button"><i class="bi bi-plug"></i> 儲存並連線</button>
                <span class="help-text">請先在 Supabase SQL Editor 執行 repo 裡的 <code>supabase_links.sql</code>。</span>
            </div>
        </div>
    </section>

    <section id="loginPanel" class="status-card hidden">
        <h2 class="status-title">🔐 私人收藏，需要先登入</h2>
        <p class="status-text">輸入你的 Email，Supabase 會寄一封登入連結給你。這樣網址收藏不會公開給其他人。</p>
        <div class="d-flex gap-2 flex-wrap mt-3">
            <input id="loginEmail" class="form-control" style="max-width:360px" type="email" placeholder="you@example.com">
            <button id="loginBtn" class="soft-btn pink" type="button"><i class="bi bi-envelope"></i> 寄登入連結</button>
            <button id="resetConfigBtn" class="soft-btn gray" type="button"><i class="bi bi-gear"></i> 重設資料庫連線</button>
        </div>
    </section>

    <section id="toolbar" class="toolbar-card hidden">
        <div class="toolbar-top">
            <div class="search-wrap">
                <i class="bi bi-search"></i>
                <input id="searchInput" class="form-control" type="search" placeholder="搜尋名稱、網址、說明或標籤...">
            </div>
            <button id="refreshBtn" class="soft-btn gray" type="button"><i class="bi bi-arrow-clockwise"></i> 重新整理</button>
        </div>
        <div id="groupPills" class="group-pills"></div>
    </section>

    <main id="groupsWrap" class="groups-wrap"></main>
</div>

<!-- 分組視窗 -->
<div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="groupModalTitle" class="modal-title fw-bold">新增分組</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input id="groupId" type="hidden">
                <label class="form-label fw-bold" for="groupName">分組名稱</label>
                <input id="groupName" class="form-control" type="text" maxlength="80" placeholder="例如：工作、設計、旅遊">
            </div>
            <div class="modal-footer justify-content-between">
                <button id="deleteGroupBtn" class="btn btn-outline-danger hidden" type="button">刪除分組</button>
                <div class="ms-auto d-flex gap-2">
                    <button class="btn btn-light" type="button" data-bs-dismiss="modal">取消</button>
                    <button id="saveGroupBtn" class="btn btn-dark" type="button">儲存</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 網址視窗 -->
<div class="modal fade" id="bookmarkModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="bookmarkModalTitle" class="modal-title fw-bold">新增網址</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input id="bookmarkId" type="hidden">
                <div class="mb-3">
                    <label class="form-label fw-bold" for="bookmarkGroup">分組</label>
                    <select id="bookmarkGroup" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="bookmarkTitle">名稱</label>
                    <input id="bookmarkTitle" class="form-control" type="text" maxlength="180" placeholder="網站名稱">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="bookmarkUrl">網址</label>
                    <input id="bookmarkUrl" class="form-control" type="url" placeholder="https://...">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="bookmarkDescription">說明</label>
                    <textarea id="bookmarkDescription" class="form-control" rows="3" maxlength="500" placeholder="可以留空"></textarea>
                </div>
                <div>
                    <label class="form-label fw-bold" for="bookmarkTags">標籤</label>
                    <input id="bookmarkTags" class="form-control" type="text" placeholder="例如：工作, UI, 常用">
                    <div class="help-text mt-1">多個標籤用逗號分隔。</div>
                </div>
            </div>
            <div class="modal-footer justify-content-between">
                <button id="deleteBookmarkBtn" class="btn btn-outline-danger hidden" type="button">刪除網址</button>
                <div class="ms-auto d-flex gap-2">
                    <button class="btn btn-light" type="button" data-bs-dismiss="modal">取消</button>
                    <button id="saveBookmarkBtn" class="btn btn-dark" type="button">儲存</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div id="toastText" class="toast-body">完成</div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 基本狀態 =====
const CONFIG_KEY = 'eateatfish_links_supabase';
let db = null;
let session = null;
let groups = [];
let bookmarks = [];
let activeGroup = 'all';
let keyword = '';
const groupModal = new bootstrap.Modal(document.getElementById('groupModal'));
const bookmarkModal = new bootstrap.Modal(document.getElementById('bookmarkModal'));
const appToast = new bootstrap.Toast(document.getElementById('appToast'), { delay: 2600 });

// 取得常用 DOM 元素，避免後面一直重複查找。
const $ = id => document.getElementById(id);

function showToast(message) {
    $('toastText').textContent = message;
    appToast.show();
}

function setVisible(id, visible) {
    $(id).classList.toggle('hidden', !visible);
}

function escapeHtml(value = '') {
    return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function normalizeUrl(value) {
    let url = value.trim();
    if (!url) return '';
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    return url;
}

function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch { return url; }
}

function getFavicon(url) {
    try { return new URL(url).origin + '/favicon.ico'; }
    catch { return ''; }
}

function parseTags(value) {
    return [...new Set(value.split(/[,，]/).map(v => v.trim()).filter(Boolean))];
}

function normalizeTobyLabels(labels) {
    if (!Array.isArray(labels)) return [];
    return labels.map(item => {
        if (typeof item === 'string') return item.trim();
        if (item && typeof item === 'object') return String(item.title || item.name || item.label || '').trim();
        return '';
    }).filter(Boolean);
}

function readConfig() {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); }
    catch { return null; }
}

function saveConfig(url, key) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify({ url: url.trim(), key: key.trim() }));
}

function clearConfig() {
    localStorage.removeItem(CONFIG_KEY);
    location.reload();
}

// ===== Supabase 連線與登入 =====
async function init() {
    const config = readConfig();
    if (!config?.url || !config?.key) {
        setVisible('setupPanel', true);
        return;
    }

    try {
        db = window.supabase.createClient(config.url, config.key);
        const { data, error } = await db.auth.getSession();
        if (error) throw error;
        session = data.session;
        updateAuthUI();

        db.auth.onAuthStateChange(async (_event, newSession) => {
            session = newSession;
            updateAuthUI();
            if (session) await loadData();
        });

        if (session) await loadData();
    } catch (error) {
        console.error(error);
        setVisible('setupPanel', true);
        showToast('連線失敗，請確認 Supabase 設定');
    }
}

function updateAuthUI() {
    const loggedIn = !!session;
    setVisible('loginPanel', !loggedIn);
    setVisible('mainActions', loggedIn);
    setVisible('stats', loggedIn);
    setVisible('toolbar', loggedIn);
    setVisible('logoutBtn', loggedIn);
    if (!loggedIn) $('groupsWrap').innerHTML = '';
}

$('saveConfigBtn').addEventListener('click', () => {
    const url = $('supabaseUrl').value.trim();
    const key = $('supabaseKey').value.trim();
    if (!url || !key) return showToast('請填入 Project URL 和 Key');
    saveConfig(url, key);
    location.reload();
});

$('resetConfigBtn').addEventListener('click', () => {
    if (confirm('要清除目前的 Supabase 連線設定嗎？')) clearConfig();
});

$('loginBtn').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();
    if (!email) return showToast('請先輸入 Email');
    const { error } = await db.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });
    if (error) return showToast('登入信寄送失敗：' + error.message);
    showToast('登入連結已寄出，去信箱點一下就可以 ✉️');
});

$('logoutBtn').addEventListener('click', async () => {
    if (!db) return;
    await db.auth.signOut();
    session = null;
    updateAuthUI();
});

// ===== 讀取與顯示資料 =====
async function loadData() {
    if (!db || !session) return;
    const [groupResult, bookmarkResult] = await Promise.all([
        db.from('bookmark_groups').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true }),
        db.from('bookmarks').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true })
    ]);

    if (groupResult.error) return showToast('讀取分組失敗：' + groupResult.error.message);
    if (bookmarkResult.error) return showToast('讀取網址失敗：' + bookmarkResult.error.message);
    groups = groupResult.data || [];
    bookmarks = bookmarkResult.data || [];
    fillGroupSelect();
    render();
}

function fillGroupSelect() {
    $('bookmarkGroup').innerHTML = groups.map(group => `<option value="${group.id}">${escapeHtml(group.name)}</option>`).join('');
}

function render() {
    renderStats();
    renderGroupPills();
    renderGroups();
}

function renderStats() {
    const tags = new Set(bookmarks.flatMap(item => item.tags || []));
    $('groupStat').textContent = `${groups.length} 個分組`;
    $('linkStat').textContent = `${bookmarks.length} 個網址`;
    $('tagStat').textContent = `${tags.size} 個標籤`;
}

function renderGroupPills() {
    const allCount = bookmarks.length;
    const buttons = [`<button class="group-pill ${activeGroup === 'all' ? 'active' : ''}" data-group="all">全部 ${allCount}</button>`];
    groups.forEach(group => {
        const count = bookmarks.filter(item => item.group_id === group.id).length;
        buttons.push(`<button class="group-pill ${activeGroup === group.id ? 'active' : ''}" data-group="${group.id}">${escapeHtml(group.name)} ${count}</button>`);
    });
    $('groupPills').innerHTML = buttons.join('');
    $('groupPills').querySelectorAll('.group-pill').forEach(btn => {
        btn.addEventListener('click', () => {
            activeGroup = btn.dataset.group;
            render();
        });
    });
}

function matchesSearch(item, groupName) {
    if (!keyword) return true;
    const text = [item.title, item.url, item.description, ...(item.tags || []), groupName].join(' ').toLowerCase();
    return text.includes(keyword);
}

function renderGroups() {
    if (!groups.length) {
        $('groupsWrap').innerHTML = `<div class="group-card"><div class="empty-box"><div class="empty-icon">📁</div><strong>還沒有分組</strong><div class="mt-1">先新增一個分組，或直接匯入 Toby JSON。</div></div></div>`;
        return;
    }

    const visibleGroups = groups.filter(group => activeGroup === 'all' || activeGroup === group.id);
    let html = '';
    visibleGroups.forEach(group => {
        const items = bookmarks.filter(item => item.group_id === group.id && matchesSearch(item, group.name));
        if (keyword && items.length === 0) return;
        html += `
            <section class="group-card">
                <header class="group-head">
                    <div class="group-title-wrap">
                        <h2 class="group-title">📁 ${escapeHtml(group.name)}</h2>
                        <div class="group-count">${items.length} 個網址</div>
                    </div>
                    <div class="group-actions">
                        <button class="icon-btn" title="新增網址" onclick="openBookmarkModal('', '${group.id}')"><i class="bi bi-plus-lg"></i></button>
                        <button class="icon-btn" title="編輯分組" onclick="openGroupModal('${group.id}')"><i class="bi bi-pencil"></i></button>
                    </div>
                </header>
                ${items.length ? `<div class="bookmark-grid">${items.map(renderBookmarkCard).join('')}</div>` : `<div class="empty-box">這個分組還沒有網址 ✨</div>`}
            </section>`;
    });

    $('groupsWrap').innerHTML = html || `<div class="group-card"><div class="empty-box"><div class="empty-icon">🔎</div>找不到符合「${escapeHtml(keyword)}」的收藏</div></div>`;
}

function renderBookmarkCard(item) {
    const domain = getDomain(item.url);
    const favicon = getFavicon(item.url);
    const tags = (item.tags || []).map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('');
    return `
        <article class="bookmark-card">
            <a class="bookmark-main" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                <div class="favicon-box">${favicon ? `<img src="${escapeHtml(favicon)}" alt="" onerror="this.style.display='none';this.parentNode.textContent='${escapeHtml((item.title || '?').charAt(0).toUpperCase())}'">` : escapeHtml((item.title || '?').charAt(0).toUpperCase())}</div>
                <div class="bookmark-info">
                    <h3 class="bookmark-title">${escapeHtml(item.title || domain)}</h3>
                    <div class="bookmark-domain">${escapeHtml(domain)}</div>
                    ${item.description ? `<p class="bookmark-desc">${escapeHtml(item.description)}</p>` : ''}
                    ${tags ? `<div class="tag-row">${tags}</div>` : ''}
                </div>
            </a>
            <button class="icon-btn bookmark-edit" title="編輯" onclick="event.preventDefault();event.stopPropagation();openBookmarkModal('${item.id}')"><i class="bi bi-three-dots"></i></button>
        </article>`;
}

$('searchInput').addEventListener('input', event => {
    keyword = event.target.value.trim().toLowerCase();
    renderGroups();
});

$('refreshBtn').addEventListener('click', loadData);

// ===== 分組 CRUD =====
function openGroupModal(id = '') {
    const group = groups.find(item => item.id === id);
    $('groupId').value = group?.id || '';
    $('groupName').value = group?.name || '';
    $('groupModalTitle').textContent = group ? '編輯分組' : '新增分組';
    setVisible('deleteGroupBtn', !!group);
    groupModal.show();
    setTimeout(() => $('groupName').focus(), 180);
}

$('saveGroupBtn').addEventListener('click', async () => {
    const id = $('groupId').value;
    const name = $('groupName').value.trim();
    if (!name) return showToast('請輸入分組名稱');

    let result;
    if (id) result = await db.from('bookmark_groups').update({ name }).eq('id', id);
    else result = await db.from('bookmark_groups').insert({ name, sort_order: groups.length });
    if (result.error) return showToast('儲存失敗：' + result.error.message);

    groupModal.hide();
    await loadData();
    showToast(id ? '分組已更新' : '分組已新增');
});

$('deleteGroupBtn').addEventListener('click', async () => {
    const id = $('groupId').value;
    const group = groups.find(item => item.id === id);
    if (!group || !confirm(`確定刪除「${group.name}」？裡面的網址也會一起刪除。`)) return;
    const { error } = await db.from('bookmark_groups').delete().eq('id', id);
    if (error) return showToast('刪除失敗：' + error.message);
    if (activeGroup === id) activeGroup = 'all';
    groupModal.hide();
    await loadData();
    showToast('分組已刪除');
});

// ===== 網址 CRUD =====
function openBookmarkModal(id = '', groupId = '') {
    if (!groups.length) {
        showToast('請先新增一個分組');
        return;
    }
    const item = bookmarks.find(bookmark => bookmark.id === id);
    $('bookmarkId').value = item?.id || '';
    $('bookmarkTitle').value = item?.title || '';
    $('bookmarkUrl').value = item?.url || '';
    $('bookmarkDescription').value = item?.description || '';
    $('bookmarkTags').value = (item?.tags || []).join(', ');
    $('bookmarkGroup').value = item?.group_id || groupId || groups[0].id;
    $('bookmarkModalTitle').textContent = item ? '編輯網址' : '新增網址';
    setVisible('deleteBookmarkBtn', !!item);
    bookmarkModal.show();
    setTimeout(() => $('bookmarkTitle').focus(), 180);
}

$('saveBookmarkBtn').addEventListener('click', async () => {
    const id = $('bookmarkId').value;
    const groupId = $('bookmarkGroup').value;
    const title = $('bookmarkTitle').value.trim();
    const url = normalizeUrl($('bookmarkUrl').value);
    const description = $('bookmarkDescription').value.trim();
    const tags = parseTags($('bookmarkTags').value);
    if (!groupId) return showToast('請選擇分組');
    if (!title) return showToast('請輸入名稱');
    if (!url) return showToast('請輸入網址');

    const payload = { group_id: groupId, title, url, description, tags };
    let result;
    if (id) result = await db.from('bookmarks').update(payload).eq('id', id);
    else {
        const sortOrder = bookmarks.filter(item => item.group_id === groupId).length;
        result = await db.from('bookmarks').insert({ ...payload, sort_order: sortOrder });
    }
    if (result.error) return showToast('儲存失敗：' + result.error.message);

    bookmarkModal.hide();
    await loadData();
    showToast(id ? '網址已更新' : '網址已新增');
});

$('deleteBookmarkBtn').addEventListener('click', async () => {
    const id = $('bookmarkId').value;
    const item = bookmarks.find(bookmark => bookmark.id === id);
    if (!item || !confirm(`確定刪除「${item.title}」？`)) return;
    const { error } = await db.from('bookmarks').delete().eq('id', id);
    if (error) return showToast('刪除失敗：' + error.message);
    bookmarkModal.hide();
    await loadData();
    showToast('網址已刪除');
});

// ===== Toby JSON 匯入 =====
$('tobyFile').addEventListener('change', async event => {
    const file = event.target.files?.[0];
    event.target.value = '';
    if (!file) return;

    try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.lists)) throw new Error('找不到 Toby lists 資料');
        if (!confirm(`找到 ${data.lists.length} 個 Toby 分組，要匯入到收藏夾嗎？\n同一分組內已存在的相同網址會略過。`)) return;

        let importedGroups = 0;
        let importedLinks = 0;
        const groupMap = new Map(groups.map(group => [group.name.trim().toLowerCase(), group]));

        for (let listIndex = 0; listIndex < data.lists.length; listIndex++) {
            const list = data.lists[listIndex] || {};
            const groupName = String(list.title || `Toby 分組 ${listIndex + 1}`).trim();
            const groupKey = groupName.toLowerCase();
            let group = groupMap.get(groupKey);

            if (!group) {
                const { data: inserted, error } = await db.from('bookmark_groups')
                    .insert({ name: groupName, sort_order: groups.length + importedGroups })
                    .select('*').single();
                if (error) throw error;
                group = inserted;
                groupMap.set(groupKey, group);
                importedGroups++;
            }

            const { data: existing, error: existingError } = await db.from('bookmarks').select('url').eq('group_id', group.id);
            if (existingError) throw existingError;
            const existingUrls = new Set((existing || []).map(item => item.url));
            const listTags = normalizeTobyLabels(list.labels);
            const rows = [];

            (list.cards || []).forEach((card, cardIndex) => {
                const url = normalizeUrl(String(card.url || ''));
                if (!url || existingUrls.has(url)) return;
                const title = String(card.customTitle || card.title || getDomain(url) || '未命名').trim();
                const description = String(card.customDescription || '').trim();
                const tags = [...new Set([...listTags, ...normalizeTobyLabels(card.labels)])];
                rows.push({ group_id: group.id, title, url, description, tags, sort_order: (existing?.length || 0) + cardIndex });
                existingUrls.add(url);
            });

            if (rows.length) {
                const { error } = await db.from('bookmarks').insert(rows);
                if (error) throw error;
                importedLinks += rows.length;
            }
        }

        await loadData();
        showToast(`匯入完成：${importedGroups} 個新分組、${importedLinks} 個網址 🎉`);
    } catch (error) {
        console.error(error);
        showToast('Toby 匯入失敗：' + error.message);
    }
});

init();
</script>
</body>
</html>
